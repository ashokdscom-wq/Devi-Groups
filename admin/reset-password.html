<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>DEVI GROUPS — Reset Admin Password</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../cms-config.js"></script>
</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">

    <main class="bg-white rounded-3xl shadow-xl p-8 w-full max-w-md">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-slate-900 text-white rounded-2xl mx-auto flex items-center justify-center text-2xl">
                <span>DG</span>
            </div>

            <h1 class="text-2xl font-black text-slate-900 mt-4">
                DEVI GROUPS
            </h1>

            <p class="text-slate-500 text-sm mt-2">
                Reset your Admin Password
            </p>
        </div>

        <div id="status"
             role="status"
             aria-live="polite"
             class="rounded-xl p-3 text-sm font-semibold bg-blue-50 text-blue-700 mb-5">
            Verifying your password reset link...
        </div>

        <form id="resetForm" class="hidden space-y-4">

            <div>
                <label for="newPassword"
                       class="block text-sm font-bold text-slate-700 mb-1">
                    New Password
                </label>

                <input id="newPassword"
                       type="password"
                       minlength="8"
                       autocomplete="new-password"
                       required
                       placeholder="Enter new password"
                       class="w-full border border-slate-300 rounded-xl p-3 focus:outline-none focus:border-emerald-500">
            </div>

            <div>
                <label for="confirmPassword"
                       class="block text-sm font-bold text-slate-700 mb-1">
                    Confirm New Password
                </label>

                <input id="confirmPassword"
                       type="password"
                       minlength="8"
                       autocomplete="new-password"
                       required
                       placeholder="Enter password again"
                       class="w-full border border-slate-300 rounded-xl p-3 focus:outline-none focus:border-emerald-500">
            </div>

            <button id="saveBtn"
                    type="submit"
                    class="w-full bg-slate-900 hover:bg-slate-800 text-white rounded-xl p-3 font-bold">
                Save New Password
            </button>
        </form>

        <a id="loginLink"
           href="./"
           class="hidden mt-5 block w-full text-center bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl p-3 font-bold">
            Go to Admin Login
        </a>

        <p class="text-xs text-slate-400 text-center mt-6">
            DEVI GROUPS Secure Admin Panel
        </p>
    </main>


<script>
'use strict';

(async function () {
    const status = document.getElementById('status');
    const form = document.getElementById('resetForm');
    const saveBtn = document.getElementById('saveBtn');
    const loginLink = document.getElementById('loginLink');

    const cfg = window.DEVI_CMS_CONFIG;

    let recoveryVerified = false;
    let passwordSaved = false;

    function showStatus(message, type = 'info') {
        status.textContent = message;

        const styles = {
            info: 'bg-blue-50 text-blue-700',
            success: 'bg-emerald-50 text-emerald-700',
            error: 'bg-rose-50 text-rose-700'
        };

        status.className =
            'rounded-xl p-3 text-sm font-semibold mb-5 ' +
            (styles[type] || styles.info);
    }

    function showLoginLink() {
        loginLink.classList.remove('hidden');
    }

    function showResetForm() {
        recoveryVerified = true;
        form.classList.remove('hidden');

        showStatus(
            'Reset link verified. Enter and confirm your new password.',
            'success'
        );
    }

    if (!cfg?.supabaseUrl || !cfg?.supabaseKey || !window.supabase) {
        showStatus(
            'Configuration error. Check your ../cms-config.js file.',
            'error'
        );
        return;
    }

    const sb = window.supabase.createClient(
        cfg.supabaseUrl,
        cfg.supabaseKey
    );

    // Handle the password-recovery event sent by Supabase.
    const { data: authListener } = sb.auth.onAuthStateChange(
        (event, session) => {
            if (event === 'PASSWORD_RECOVERY' && session) {
                showResetForm();
            }
        }
    );

    try {
        const url = new URL(window.location.href);
        const query = url.searchParams;
        const hash = new URLSearchParams(url.hash.replace(/^#/, ''));

        const errorCode =
            hash.get('error_code') ||
            query.get('error_code') ||
            hash.get('error') ||
            query.get('error');

        if (errorCode) {
            const description =
                hash.get('error_description') ||
                query.get('error_description');

            throw new Error(
                description
                    ? decodeURIComponent(description.replace(/\+/g, ' '))
                    : 'This reset link is invalid or expired. Request a new reset email.'
            );
        }

        // PKCE links may provide a code in the query string.
        // Supabase processes the code through detectSessionInUrl.
        // Implicit-flow links may provide tokens in the URL hash.
        const hasRecoveryType =
            hash.get('type') === 'recovery' ||
            query.get('type') === 'recovery';

        const hasCode = query.has('code');

        if (!hasRecoveryType && !hasCode) {
            throw new Error(
                'No valid password recovery information was found. ' +
                'Open the latest reset link from your email.'
            );
        }

        // Wait for Supabase to exchange the recovery link for a session.
        for (let attempt = 0; attempt < 24; attempt++) {
            if (recoveryVerified) break;

            const { data, error } = await sb.auth.getSession();

            if (error) throw error;

            if (data.session && hasRecoveryType) {
                showResetForm();
                break;
            }

            await new Promise(resolve => setTimeout(resolve, 250));
        }

        if (!recoveryVerified) {
            showStatus(
                'Could not verify your reset session. The link may have expired. ' +
                'Return to Admin Login and request a new reset email.',
                'error'
            );
            showLoginLink();
        }

    } catch (error) {
        showStatus(
            error.message || 'Could not verify your reset link.',
            'error'
        );
        showLoginLink();
    }


    // Save the new password.
    form.addEventListener('submit', async event => {
        event.preventDefault();

        if (!recoveryVerified || passwordSaved) return;

        const newPassword =
            document.getElementById('newPassword').value;

        const confirmPassword =
            document.getElementById('confirmPassword').value;

        if (newPassword.length < 8) {
            showStatus(
                'Your password must contain at least 8 characters.',
                'error'
            );
            return;
        }

        if (newPassword !== confirmPassword) {
            showStatus(
                'Both passwords must match. Please try again.',
                'error'
            );
            return;
        }

        saveBtn.disabled = true;
        saveBtn.textContent = 'Saving Password...';

        try {
            const { data: sessionData, error: sessionError } =
                await sb.auth.getSession();

            if (sessionError) throw sessionError;

            if (!sessionData.session) {
                throw new Error(
                    'Your recovery session has expired. Request a new reset email.'
                );
            }

            const { error } = await sb.auth.updateUser({
                password: newPassword
            });

            if (error) throw error;

            passwordSaved = true;
            form.classList.add('hidden');

            showStatus(
                'Your password has been updated successfully. ' +
                'You can now log in using your new password.',
                'success'
            );

            showLoginLink();

            // End the session so the user can test login with the new password.
            const { error: signOutError } = await sb.auth.signOut();

            if (signOutError) {
                console.warn('Sign-out notice:', signOutError.message);
            }

        } catch (error) {
            showStatus(
                error.message || 'Unable to update your password.',
                'error'
            );

            saveBtn.disabled = false;
            saveBtn.textContent = 'Save New Password';
        }
    });
})();
</script>

</body>
</html>
