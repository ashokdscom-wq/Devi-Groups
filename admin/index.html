
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DEVI GROUPS — Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../cms-config.js"></script>
  <style>
    html,body { height:100%; margin:0; }
    #siteFrame { width:100%; height:100%; border:0; }
    .glass { backdrop-filter:blur(10px); }
    button:disabled { opacity:.6; cursor:not-allowed; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900">

<!-- LOGIN -->
<div id="login" class="min-h-screen grid place-items-center p-4">
  <form id="loginForm" class="bg-white rounded-3xl shadow-2xl p-8 w-[min(420px,92vw)]">
    <h1 class="text-3xl font-black text-slate-900">DEVI GROUPS</h1>
    <p class="text-slate-500 mb-6 text-sm">Secure Visual Admin Panel</p>
    <label for="email" class="block text-xs font-bold mb-1">Admin Email</label>
    <input id="email" type="email" autocomplete="username" required placeholder="Admin email"
      class="w-full border border-slate-300 rounded-xl p-3 mb-4 text-sm">
    <label for="password" class="block text-xs font-bold mb-1">Password</label>
    <input id="password" type="password" autocomplete="current-password" required placeholder="Password"
      class="w-full border border-slate-300 rounded-xl p-3 mb-3 text-sm">
    <button id="loginBtn" type="submit" class="w-full bg-slate-900 text-white rounded-xl p-3 font-bold">
      Login to Admin
    </button>
    <button id="forgotBtn" type="button" class="w-full mt-3 text-sm font-bold text-blue-600">
      Forgot Password?
    </button>
    <div id="loginMsg" role="status" class="text-xs text-rose-600 mt-3 font-bold" aria-live="polite"></div>
    <div id="resetMsg" role="status" class="text-xs mt-3 font-bold" aria-live="polite"></div>
  </form>
</div>

<!-- MAIN ADMIN APP -->
<div id="app" class="hidden h-screen flex flex-col">
  <header class="min-h-16 bg-slate-950 text-white flex items-center justify-between gap-3 px-5 py-3 shrink-0 shadow-md">
    <div>
      <b class="text-xl tracking-wide">DEVI GROUPS</b>
      <span class="text-xs text-slate-400 ml-2 hidden sm:inline">Ultimate CMS &amp; Visual Editor</span>
    </div>
    <div class="flex flex-wrap gap-2">
      <button id="refreshSite" class="px-3 py-2 rounded-xl bg-white/10 text-xs font-bold">
        <i class="fa-solid fa-rotate mr-1"></i> Refresh
      </button>
      <a href="../index.html" target="_blank" rel="noopener noreferrer"
        class="px-3 py-2 rounded-xl bg-white/10 text-xs font-bold">
        <i class="fa-solid fa-globe mr-1"></i> Website ↗
      </a>
      <button id="logout" class="px-3 py-2 rounded-xl bg-rose-600/80 text-xs font-bold">
        <i class="fa-solid fa-right-from-bracket mr-1"></i> Logout
      </button>
    </div>
  </header>

  <div class="flex-1 min-h-0 flex">
    <!-- SIDEBAR -->
    <aside class="w-72 max-w-[45vw] bg-white border-r border-slate-200 p-4 overflow-y-auto space-y-3 shrink-0">
      <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Website Pages</div>
      <div id="pages" class="space-y-1"></div>
      <hr class="border-slate-200 my-4">
      <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Database Managers</div>
      <button id="reviewsBtn" class="w-full text-left p-3 rounded-xl hover:bg-slate-100 font-semibold text-xs flex items-center gap-2 text-slate-700">
        <i class="fa-solid fa-star text-amber-500 w-4"></i> Manage Reviews
      </button>
      <button id="productsBtn" class="w-full text-left p-3 rounded-xl hover:bg-slate-100 font-semibold text-xs flex items-center gap-2 text-slate-700">
        <i class="fa-solid fa-box text-blue-500 w-4"></i> View All Products
      </button>
      <button id="unitsBtn" class="w-full text-left p-3 rounded-xl hover:bg-slate-100 font-semibold text-xs flex items-center gap-2 text-slate-700">
        <i class="fa-solid fa-building text-emerald-500 w-4"></i> Business Units
      </button>
      <button id="brochuresBtn" class="w-full text-left p-3 rounded-xl hover:bg-slate-100 font-semibold text-xs flex items-center gap-2 text-slate-700">
        <i class="fa-solid fa-file-pdf text-rose-500 w-4"></i> View Brochures
      </button>
    </aside>

    <!-- WEBSITE FRAME AND EDITOR -->
    <main class="flex-1 min-w-0 relative bg-slate-200">
      <iframe id="siteFrame" title="Website Visual Editor" src="../index.html?admin=1"></iframe>
      <div id="editor" class="hidden absolute top-0 right-0 w-[420px] max-w-[95%] h-full bg-white shadow-2xl overflow-y-auto border-l border-slate-200 z-50">
        <div class="p-5 border-b bg-slate-50 flex justify-between items-center sticky top-0 z-10">
          <div>
            <h2 class="text-xl font-black text-slate-800">Edit Element</h2>
            <p id="selectedInfo" class="text-xs text-slate-500 font-mono mt-1"></p>
          </div>
          <button id="closeEditor" type="button" class="text-xl text-slate-400">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div class="p-5 space-y-4 text-xs">
          <div id="textBox">
            <label for="textValue" class="font-bold text-slate-700 block mb-1">Display Text</label>
            <textarea id="textValue" rows="6" class="w-full border border-slate-300 rounded-xl p-3 text-xs"></textarea>
          </div>
          <div id="srcBox">
            <label for="fileValue" class="font-bold text-slate-700 block mb-1">Upload Photo / File</label>
            <input id="fileValue" type="file" class="w-full border border-slate-300 rounded-xl p-2 mb-2 bg-slate-50">
            <input id="srcValue" class="w-full border border-slate-300 rounded-xl p-2.5" placeholder="Existing URL / path">
          </div>
          <div id="hrefBox">
            <label for="hrefValue" class="font-bold text-slate-700 block mb-1">Link / Button URL</label>
            <input id="hrefValue" class="w-full border border-slate-300 rounded-xl p-2.5">
          </div>
          <div id="altBox">
            <label for="altValue" class="font-bold text-slate-700 block mb-1">Alt / Title Text</label>
            <input id="altValue" class="w-full border border-slate-300 rounded-xl p-2.5">
          </div>
          <div id="actionBox" class="hidden space-y-2 bg-slate-50 p-3 rounded-xl border border-slate-200">
            <label class="font-bold text-slate-800">Advanced Details</label>
            <input id="action1" class="w-full border rounded-xl p-2" placeholder="Title / Product Name">
            <input id="action2" class="w-full border rounded-xl p-2" placeholder="Specification / PDF Link">
            <input id="action3" class="w-full border rounded-xl p-2" placeholder="Standard / Extra">
            <input id="action4" class="w-full border rounded-xl p-2" placeholder="Packing">
          </div>
          <button id="saveElement" type="button" class="w-full bg-emerald-600 text-white p-3 rounded-xl font-black text-sm">
            SAVE CHANGES
          </button>
          <div id="saveMsg" role="status" class="font-bold text-center"></div>
          <div id="syncMsg" class="text-slate-400 text-center">Changes sync live to website when the site supports CMS messages.</div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- DATABASE DRAWER -->
<div id="drawer" class="hidden fixed inset-0 bg-black/50 z-[100] glass items-center justify-end">
  <div class="h-full w-[600px] max-w-[95vw] bg-white shadow-2xl overflow-y-auto flex flex-col">
    <div class="p-5 border-b bg-slate-50 flex justify-between items-center sticky top-0 z-10">
      <h2 id="drawerTitle" class="text-lg font-black text-slate-800 tracking-wide uppercase"></h2>
      <button id="drawerClose" type="button" class="text-xl text-slate-400 hover:text-rose-600">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div id="drawerBody" class="p-6 flex-grow"></div>
  </div>
</div>

<script>
'use strict';

const cfg = window.DEVI_CMS_CONFIG;
if (!cfg || !cfg.supabaseUrl || !cfg.supabaseKey) {
  document.getElementById('loginMsg').textContent =
    'Configuration error: check the ../cms-config.js file and Supabase settings.';
  throw new Error('DEVI_CMS_CONFIG is missing or incomplete.');
}

const sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
const frame = document.getElementById('siteFrame');
let selected = null;
let isAuthenticated = false;
const $ = id => document.getElementById(id);

function showDrawer() {
  $('drawer').classList.remove('hidden');
  $('drawer').classList.add('flex');
}
function hideDrawer() {
  $('drawer').classList.add('hidden');
  $('drawer').classList.remove('flex');
}
function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  })[ch]);
}
function showApp() {
  isAuthenticated = true;
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
}
function showLogin(message = '') {
  isAuthenticated = false;
  $('app').classList.add('hidden');
  $('login').classList.remove('hidden');
  $('loginMsg').textContent = message;
}
function nav(page) {
  if (!isAuthenticated) return;
  if (!frame || !frame.contentWindow) {
    alert('Website frame load થયો નથી. પેજ રિફ્રેશ કરો.');
    return;
  }
  frame.contentWindow.postMessage({
    source:'devi-visual-cms', type:'NAVIGATE', page
  }, window.location.origin);
}

const pages = [
  ['home','HOME'],
  ['about','ABOUT US'],
  ['company','COMPANY'],
  ['products','PRODUCTS'],
  ['sister-brand','OUR SISTER BRAND'],
  ['contact','CONTACT US']
];
pages.forEach(([id,name]) => {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'w-full text-left p-2.5 px-3 rounded-xl hover:bg-slate-100 font-semibold text-slate-700 text-xs transition flex items-center gap-2';
  const icon = document.createElement('i');
  icon.className = 'fa-solid fa-angle-right text-slate-300';
  button.append(icon, document.createTextNode(' ' + name));
  button.addEventListener('click', () => nav(id));
  $('pages').appendChild(button);
});

// FILE UPLOAD
async function upload(file, folder = 'visual') {
  if (!file) return '';
  if (!isAuthenticated) throw new Error('Please log in first.');
  const extension = file.name.includes('.') ? file.name.split('.').pop().toLowerCase() : '';
  const path = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2)}${extension ? '.' + extension : ''}`;
  const { error } = await sb.storage.from('devi-media').upload(path, file, { upsert:false });
  if (error) throw error;
  return `${cfg.supabaseUrl}/storage/v1/object/public/devi-media/${path}`;
}

// VISUAL EDITOR MESSAGES
window.addEventListener('message', event => {
  if (event.origin !== window.location.origin) return;
  const data = event.data;
  if (!data || data.source !== 'devi-visual-cms') return;
  if (data.type === 'EDIT_ELEMENT') {
    selected = data.element || data.payload || null;
    $('selectedInfo').textContent = selected ? (selected.selector || selected.tagName || 'Selected element') : '';
    $('textValue').value = selected?.text || selected?.textContent || '';
    $('srcValue').value = selected?.src || selected?.image || '';
    $('hrefValue').value = selected?.href || '';
    $('altValue').value = selected?.alt || selected?.title || '';
    $('editor').classList.remove('hidden');
  }
  if (data.type === 'OPEN_BROCHURES') $('brochuresBtn').click();
});

$('closeEditor').addEventListener('click', () => $('editor').classList.add('hidden'));
$('saveElement').addEventListener('click', async () => {
  if (!isAuthenticated || !selected) return;
  $('saveMsg').textContent = 'Saving...';
  try {
    let src = $('srcValue').value.trim();
    const file = $('fileValue').files[0];
    if (file) src = await upload(file, 'visual');
    frame.contentWindow.postMessage({
      source:'devi-visual-cms',
      type:'SAVE_ELEMENT',
      payload:{
        ...selected,
        text:$('textValue').value,
        src,
        href:$('hrefValue').value,
        alt:$('altValue').value,
        action1:$('action1').value,
        action2:$('action2').value,
        action3:$('action3').value,
        action4:$('action4').value
      }
    }, window.location.origin);
    $('saveMsg').textContent = 'Save request sent to website.';
  } catch (error) {
    $('saveMsg').textContent = 'Error: ' + error.message;
  }
});
    
// PRODUCTS MANAGER
async function openProductsManager() {
  if (!isAuthenticated) return;

  $('drawerTitle').textContent = 'All Products';
  $('drawerBody').innerHTML = '<p class="text-slate-500">Loading products...</p>';
  showDrawer();

  try {
    const { data, error } = await sb.from('products')
      .select('*').order('sort_order', { ascending: true });

    if (error) throw error;

    $('drawerBody').innerHTML = `
      <button id="addProductBtn"
        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white p-3 rounded-xl font-bold mb-4">
        + Add New Product
      </button>
      ${(data || []).map((p, i) => `
        <div class="border rounded-xl p-3 mb-3 flex gap-3 items-center">
          ${p.photo_url || p.image_url
            ? `<img src="${esc(p.photo_url || p.image_url)}" class="w-16 h-16 object-cover rounded-lg" alt="">`
            : '<div class="w-16 h-16 bg-slate-100 rounded-lg grid place-items-center">No photo</div>'}
          <div class="flex-1 min-w-0">
            <b class="block text-sm">${esc(p.name || 'Unnamed Product')}</b>
            <span class="text-xs text-slate-500">${esc(p.product_code || '')}</span>
            <span class="block text-xs ${p.active === false ? 'text-rose-600' : 'text-emerald-600'}">
              ${p.active === false ? 'Inactive' : 'Active'}
            </span>
          </div>
          <button data-edit-product="${i}" class="bg-slate-900 text-white rounded-lg px-3 py-2 text-xs">Edit</button>
          <button data-delete-product="${i}" class="bg-rose-100 text-rose-600 rounded-lg px-3 py-2 text-xs">Delete</button>
        </div>
      `).join('') || '<p>No products found.</p>'}
    `;

    $('addProductBtn').onclick = () => editProduct({}, true);

    $('drawerBody').querySelectorAll('[data-edit-product]').forEach(btn => {
      btn.onclick = () => editProduct(data[Number(btn.dataset.editProduct)]);
    });

    $('drawerBody').querySelectorAll('[data-delete-product]').forEach(btn => {
      btn.onclick = async () => {
        const product = data[Number(btn.dataset.deleteProduct)];
        if (!product || !confirm(`Delete ${product.name}?`)) return;

        const { error } = await sb.from('products').delete().eq('id', product.id);
        if (error) alert('Delete error: ' + error.message);
        else openProductsManager();
      };
    });
  } catch (error) {
    $('drawerBody').textContent = 'Error: ' + error.message;
  }
}

$('productsBtn').addEventListener('click', openProductsManager);

window.editProduct = (product = {}, isNew = false) => {
  if (!isAuthenticated) return;

  $('drawerTitle').textContent = isNew ? 'Add Product' : 'Edit Product';

  $('drawerBody').innerHTML = `
    <form id="productForm" class="space-y-3 text-sm">
      <label class="block font-bold">Product Name *
        <input id="p_name" required class="w-full border rounded-xl p-2.5 mt-1"
          value="${esc(product.name || '')}">
      </label>

      <label class="block font-bold">Product Code
        <input id="p_code" class="w-full border rounded-xl p-2.5 mt-1"
          value="${esc(product.product_code || '')}">
      </label>

      <label class="block font-bold">Business Unit
        <input id="p_unit" class="w-full border rounded-xl p-2.5 mt-1"
          value="${esc(product.business_unit || '')}">
      </label>

      <label class="block font-bold">Category
        <input id="p_category" class="w-full border rounded-xl p-2.5 mt-1"
          value="${esc(product.category || '')}">
      </label>

      <label class="block font-bold">Description / Features
        <textarea id="p_description" rows="4" class="w-full border rounded-xl p-2.5 mt-1">${esc(product.description || '')}</textarea>
      </label>

      <label class="block font-bold">Packing
        <input id="p_packing" class="w-full border rounded-xl p-2.5 mt-1"
          value="${esc(product.packing || '')}">
      </label>

      <label class="block font-bold">Unit
        <input id="p_unit_name" class="w-full border rounded-xl p-2.5 mt-1"
          value="${esc(product.unit || '')}">
      </label>

      <label class="block font-bold">Sort Order
        <input id="p_sort" type="number" class="w-full border rounded-xl p-2.5 mt-1"
          value="${Number(product.sort_order) || 0}">
      </label>

      <label class="block font-bold">Product Photo
        <input id="p_photo_file" type="file" accept="image/*"
          class="w-full border rounded-xl p-2 mt-1">
      </label>

      <label class="block font-bold">Or Photo URL
        <input id="p_photo_url" class="w-full border rounded-xl p-2.5 mt-1"
          value="${esc(product.photo_url || product.image_url || '')}">
      </label>

      <label class="block font-bold">Additional Product Files
        <input id="p_files" type="file" multiple
          class="w-full border rounded-xl p-2 mt-1">
      </label>

      <label class="block font-bold">Brochure PDF / File
        <input id="p_brochure" type="file" accept=".pdf,.doc,.docx"
          class="w-full border rounded-xl p-2 mt-1">
      </label>

      ${product.brochure_url
        ? `<a href="${esc(product.brochure_url)}" target="_blank" rel="noopener" class="text-blue-600 underline block">Open current brochure</a>`
        : ''}

      <label class="flex gap-2 items-center font-bold">
        <input id="p_active" type="checkbox" ${product.active !== false ? 'checked' : ''}>
        Active on website
      </label>

      <button id="saveProductBtn" class="w-full bg-emerald-600 text-white rounded-xl p-3 font-bold">
        ${isNew ? 'Add Product' : 'Save Product'}
      </button>
      <p id="productStatus" class="text-sm font-bold"></p>
    </form>
  `;

  $('productForm').addEventListener('submit', async event => {
    event.preventDefault();

    const btn = $('saveProductBtn');
    const status = $('productStatus');
    btn.disabled = true;
    status.textContent = 'Saving product...';

    try {
      const payload = {
        name: $('p_name').value.trim(),
        product_code: $('p_code').value.trim() || null,
        business_unit: $('p_unit').value.trim() || null,
        category: $('p_category').value.trim() || null,
        description: $('p_description').value.trim() || null,
        packing: $('p_packing').value.trim() || null,
        unit: $('p_unit_name').value.trim() || null,
        sort_order: Number($('p_sort').value) || 0,
        active: $('p_active').checked,
        updated_at: new Date().toISOString()
      };

      const photo = $('p_photo_file').files[0];
      let photoUrl = $('p_photo_url').value.trim();

      if (photo) photoUrl = await upload(photo, 'products');

      if (photoUrl) {
        payload.photo_url = photoUrl;
        payload.image_url = photoUrl;
      }

      const files = Array.from($('p_files').files);
      if (files.length) {
        const urls = [];
        for (const file of files) urls.push(await upload(file, 'product-files'));
        payload.files_url = JSON.stringify(urls);
      }

      const brochure = $('p_brochure').files[0];
      if (brochure) payload.brochure_url = await upload(brochure, 'brochures');

      const result = isNew
        ? await sb.from('products').insert([payload])
        : await sb.from('products').update(payload).eq('id', product.id);

      if (result.error) throw result.error;

      status.className = 'text-emerald-700 font-bold';
      status.textContent = 'Product saved successfully.';
      openProductsManager();
    } catch (error) {
      status.className = 'text-rose-600 font-bold';
      status.textContent = 'Error: ' + error.message;
      btn.disabled = false;
    }
  });

  showDrawer();
};

// BUSINESS UNITS MANAGER
async function openUnitsManager() {
  if (!isAuthenticated) return;

  $('drawerTitle').textContent = 'Business Units';
  $('drawerBody').textContent = 'Loading business units...';
  showDrawer();

  try {
    const { data, error } = await sb.from('business_units')
      .select('*').order('sort_order', { ascending: true });

    if (error) throw error;

    $('drawerBody').innerHTML = `
      <button id="addUnitBtn" class="w-full bg-emerald-600 text-white p-3 rounded-xl font-bold mb-4">
        + Add Business Unit
      </button>
      ${(data || []).map((u, i) => `
        <div class="border rounded-xl p-3 mb-3 flex gap-3 items-center">
          ${u.image_url ? `<img src="${esc(u.image_url)}" class="w-14 h-14 object-cover rounded-lg" alt="">` : ''}
          <div class="flex-1">
            <b>${esc(u.name || 'Business Unit')}</b>
            <div class="text-xs text-slate-500">${esc(u.website || u.website_url || '')}</div>
          </div>
          <button data-edit-unit="${i}" class="bg-slate-900 text-white rounded-lg px-3 py-2 text-xs">Edit</button>
          <button data-delete-unit="${i}" class="bg-rose-100 text-rose-600 rounded-lg px-3 py-2 text-xs">Remove</button>
        </div>
      `).join('') || '<p>No business units found.</p>'}
    `;

    $('addUnitBtn').onclick = () => editUnit({}, true);

    $('drawerBody').querySelectorAll('[data-edit-unit]').forEach(btn => {
      btn.onclick = () => editUnit(data[Number(btn.dataset.editUnit)]);
    });

    $('drawerBody').querySelectorAll('[data-delete-unit]').forEach(btn => {
      btn.onclick = async () => {
        const unit = data[Number(btn.dataset.deleteUnit)];
        if (!unit || !confirm(`Remove ${unit.name}?`)) return;

        const { error } = await sb.from('business_units').delete().eq('id', unit.id);
        if (error) alert(error.message);
        else openUnitsManager();
      };
    });
  } catch (error) {
    $('drawerBody').textContent = 'Error: ' + error.message;
  }
}

$('unitsBtn').addEventListener('click', openUnitsManager);

window.editUnit = (unit = {}, isNew = false) => {
  if (!isAuthenticated) return;

  $('drawerTitle').textContent = isNew ? 'Add Business Unit' : 'Edit Business Unit';

  $('drawerBody').innerHTML = `
    <form id="unitForm" class="space-y-3 text-sm">
      <label class="block font-bold">Name *
        <input id="u_name" required class="w-full border rounded-xl p-2.5 mt-1" value="${esc(unit.name || '')}">
      </label>

      <label class="block font-bold">Description
        <textarea id="u_desc" rows="3" class="w-full border rounded-xl p-2.5 mt-1">${esc(unit.description || '')}</textarea>
      </label>

      <label class="block font-bold">Upload Photo
        <input id="u_photo_file" type="file" accept="image/*" class="w-full border rounded-xl p-2 mt-1">
      </label>

      <label class="block font-bold">Image URL
        <input id="u_img" class="w-full border rounded-xl p-2.5 mt-1" value="${esc(unit.image_url || '')}">
      </label>

      <label class="block font-bold">Website URL
        <input id="u_website" class="w-full border rounded-xl p-2.5 mt-1" value="${esc(unit.website_url || unit.website || '')}">
      </label>

      <label class="block font-bold">Address
        <textarea id="u_address" class="w-full border rounded-xl p-2.5 mt-1">${esc(unit.address || '')}</textarea>
      </label>

      <label class="block font-bold">Location URL
        <input id="u_location" class="w-full border rounded-xl p-2.5 mt-1" value="${esc(unit.location_url || '')}">
      </label>

      <label class="block font-bold">Sort Order
        <input id="u_sort" type="number" class="w-full border rounded-xl p-2.5 mt-1" value="${Number(unit.sort_order) || 0}">
      </label>

      <label class="flex gap-2 items-center font-bold">
        <input id="u_active" type="checkbox" ${unit.active !== false ? 'checked' : ''}>
        Active on website
      </label>

      <button id="saveUnitBtn" class="w-full bg-emerald-600 text-white p-3 rounded-xl font-bold">
        ${isNew ? 'Add Business Unit' : 'Save Changes'}
      </button>
      <p id="unitStatus" class="font-bold"></p>
    </form>
  `;

  $('unitForm').addEventListener('submit', async event => {
    event.preventDefault();
    const btn = $('saveUnitBtn');
    btn.disabled = true;

    try {
      const website = $('u_website').value.trim() || null;
      const payload = {
        name: $('u_name').value.trim(),
        description: $('u_desc').value.trim() || null,
        image_url: $('u_img').value.trim() || null,
        website_url: website,
        website,
        address: $('u_address').value.trim() || null,
        location_url: $('u_location').value.trim() || null,
        sort_order: Number($('u_sort').value) || 0,
        active: $('u_active').checked,
        updated_at: new Date().toISOString()
      };

      const photo = $('u_photo_file').files[0];
      if (photo) payload.image_url = await upload(photo, 'business-units');

      const result = isNew
        ? await sb.from('business_units').insert([payload])
        : await sb.from('business_units').update(payload).eq('id', unit.id);

      if (result.error) throw result.error;

      alert('Business Unit saved successfully.');
      openUnitsManager();
    } catch (error) {
      $('unitStatus').textContent = 'Error: ' + error.message;
      btn.disabled = false;
    }
  });

  showDrawer();
};

// BROCHURES MANAGER
async function openBrochureManager() {
  if (!isAuthenticated) return;

  $('drawerTitle').textContent = 'View Brochures';
  $('drawerBody').textContent = 'Loading brochures...';
  showDrawer();

  try {
    const { data, error } = await sb.from('products')
      .select('id,name,product_code,description,brochure_url')
      .not('brochure_url', 'is', null)
      .order('name', { ascending: true });

    if (error) throw error;

    $('drawerBody').innerHTML = (data || []).map((p, i) => `
      <div class="border rounded-xl p-4 mb-3">
        <b class="block">${esc(p.name || 'Unnamed Product')}</b>
        <p class="text-xs text-slate-500 mt-1">Product Code: ${esc(p.product_code || 'N/A')}</p>
        <p class="text-xs text-slate-600 mt-1">${esc(p.description || '')}</p>
        <div class="flex flex-wrap gap-2 mt-3">
          <a class="bg-blue-100 text-blue-700 rounded-lg px-3 py-2 text-xs font-bold"
             href="${esc(p.brochure_url)}" target="_blank" rel="noopener">Open Brochure ↗</a>
          <button data-update-brochure="${i}" class="bg-emerald-100 text-emerald-700 rounded-lg px-3 py-2 text-xs font-bold">Replace File</button>
          <button data-remove-brochure="${i}" class="bg-rose-100 text-rose-600 rounded-lg px-3 py-2 text-xs font-bold">Remove Brochure</button>
          <input id="brochure-file-${i}" type="file" accept=".pdf,.doc,.docx" class="hidden">
        </div>
      </div>
    `).join('') || '<p>No brochures found. Add a brochure from the Add/Edit Product form.</p>';

    $('drawerBody').querySelectorAll('[data-update-brochure]').forEach(btn => {
      btn.onclick = () => {
        const i = Number(btn.dataset.updateBrochure);
        const input = $(`brochure-file-${i}`);
        input.click();

        input.onchange = async () => {
          const file = input.files[0];
          if (!file) return;

          try {
            const url = await upload(file, 'brochures');
            const { error } = await sb.from('products')
              .update({ brochure_url: url, updated_at: new Date().toISOString() })
              .eq('id', data[i].id);

            if (error) throw error;
            alert('Brochure updated.');
            openBrochureManager();
          } catch (error) {
            alert('Update failed: ' + error.message);
          }
        };
      };
    });

    $('drawerBody').querySelectorAll('[data-remove-brochure]').forEach(btn => {
      btn.onclick = async () => {
        const p = data[Number(btn.dataset.removeBrochure)];
        if (!confirm(`Remove brochure from ${p.name}?`)) return;

        const { error } = await sb.from('products')
          .update({ brochure_url: null, updated_at: new Date().toISOString() })
          .eq('id', p.id);

        if (error) alert(error.message);
        else openBrochureManager();
      };
    });
  } catch (error) {
    $('drawerBody').textContent = 'Error: ' + error.message;
  }
}

$('brochuresBtn').addEventListener('click', openBrochureManager);

// REVIEWS MANAGER
async function openReviewsManager() {
  if (!isAuthenticated) return;

  $('drawerTitle').textContent = 'Manage Reviews';
  $('drawerBody').textContent = 'Loading reviews...';
  showDrawer();

  try {
    const { data, error } = await sb.from('reviews')
      .select('*').order('created_at', { ascending: false });

    if (error) throw error;

    $('drawerBody').innerHTML = (data || []).map((r, i) => `
      <div class="border rounded-xl p-4 mb-4">
        <label class="block text-xs font-bold">Customer Name
          <input data-r-name="${i}" class="w-full border rounded-lg p-2 mt-1" value="${esc(r.name || '')}">
        </label>
        <label class="block text-xs font-bold mt-3">Country
          <input data-r-country="${i}" class="w-full border rounded-lg p-2 mt-1" value="${esc(r.country || '')}">
        </label>
        <label class="block text-xs font-bold mt-3">Stars (1–5)
          <input data-r-stars="${i}" type="number" min="1" max="5" class="w-full border rounded-lg p-2 mt-1" value="${Number(r.stars || r.rating || 5)}">
        </label>
        <label class="block text-xs font-bold mt-3">Review
          <textarea data-r-message="${i}" rows="3" class="w-full border rounded-lg p-2 mt-1">${esc(r.message || r.review || '')}</textarea>
        </label>
        <label class="block text-xs font-bold mt-3">Status
          <input data-r-status="${i}" class="w-full border rounded-lg p-2 mt-1" value="${esc(r.status || '')}">
        </label>
        <label class="flex gap-2 items-center text-xs font-bold mt-3">
          <input data-r-active="${i}" type="checkbox" ${r.active !== false ? 'checked' : ''}>
          Active
        </label>
        <div class="flex gap-2 mt-3">
          <button data-r-save="${i}" class="bg-emerald-600 text-white rounded-lg px-4 py-2 text-xs font-bold">Save</button>
          <button data-r-delete="${i}" class="bg-rose-100 text-rose-600 rounded-lg px-4 py-2 text-xs font-bold">Delete</button>
        </div>
      </div>
    `).join('') || '<p>No reviews found.</p>';

    $('drawerBody').querySelectorAll('[data-r-save]').forEach(btn => {
      btn.onclick = async () => {
        const i = Number(btn.dataset.rSave);
        const r = data[i];
        const message = $(`[data-r-message="${i}"]`).value.trim();

        const payload = {
          name: $(`[data-r-name="${i}"]`).value.trim(),
          country: $(`[data-r-country="${i}"]`).value.trim() || null,
          stars: Math.max(1, Math.min(5, Number($(`[data-r-stars="${i}"]`).value) || 5)),
          rating: Math.max(1, Math.min(5, Number($(`[data-r-stars="${i}"]`).value) || 5)),
          message,
          review: message,
          status: $(`[data-r-status="${i}"]`).value.trim() || null,
          active: $(`[data-r-active="${i}"]`).checked,
          updated_at: new Date().toISOString()
        };

        const { error } = await sb.from('reviews').update(payload).eq('id', r.id);
        if (error) alert('Save failed: ' + error.message);
        else alert('Review saved.');
      };
    });

    $('drawerBody').querySelectorAll('[data-r-delete]').forEach(btn => {
      btn.onclick = async () => {
        const r = data[Number(btn.dataset.rDelete)];
        if (!confirm('Delete this review?')) return;

        const { error } = await sb.from('reviews').delete().eq('id', r.id);
        if (error) alert('Delete failed: ' + error.message);
        else openReviewsManager();
      };
    });
  } catch (error) {
    $('drawerBody').textContent = 'Error: ' + error.message;
  }
}

$('reviewsBtn').addEventListener('click', openReviewsManager);

// REFRESH WEBSITE
$('refreshSite').addEventListener('click', () => {
  if (!isAuthenticated) return;
  frame.src = '../index.html?admin=1&sync=' + Date.now();
});

$('drawerClose').addEventListener('click', hideDrawer);

// FORGOT PASSWORD
$('forgotBtn').addEventListener('click', async () => {
  const email = $('email').value.trim();
  const message = $('resetMsg');
  message.textContent = '';

  if (!email) {
    message.className = 'text-xs mt-3 font-bold text-rose-600';
    message.textContent = 'Enter your admin email first.';
    $('email').focus();
    return;
  }

  const button = $('forgotBtn');
  button.disabled = true;
  button.textContent = 'Sending reset email...';

  try {
    const resetUrl = new URL('reset-password.html', location.href).href;
    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: resetUrl
    });

    if (error) throw error;

    message.className = 'text-xs mt-3 font-bold text-emerald-700';
    message.textContent = 'If this email is registered, check your inbox and spam folder.';
  } catch (error) {
    message.className = 'text-xs mt-3 font-bold text-rose-600';
    message.textContent = error.message || 'Could not send reset email.';
  } finally {
    button.disabled = false;
    button.textContent = 'Forgot Password?';
  }
});

// LOGIN
$('loginForm').addEventListener('submit', async event => {
  event.preventDefault();

  const email = $('email').value.trim();
  const password = $('password').value;
  const button = $('loginBtn');

  button.disabled = true;
  button.textContent = 'Signing in...';
  $('loginMsg').textContent = '';

  try {
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;

    $('password').value = '';
    showApp();
  } catch (error) {
    showLogin(error.message || 'Login failed.');
  } finally {
    button.disabled = false;
    button.textContent = 'Login to Admin';
  }
});

// LOGOUT
$('logout').addEventListener('click', async () => {
  const { error } = await sb.auth.signOut();

  if (error) {
    alert('Logout error: ' + error.message);
    return;
  }

  showLogin('You have been logged out.');
  location.reload();
});

// AUTH SESSION
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_OUT') {
    showLogin();
  } else if (session && ['SIGNED_IN', 'INITIAL_SESSION', 'TOKEN_REFRESHED'].includes(event)) {
    showApp();
  }
});

(async () => {
  try {
    const { data, error } = await sb.auth.getSession();
    if (error) throw error;

    if (data.session) showApp();
    else showLogin();
  } catch (error) {
    showLogin('Could not verify session. Please sign in again.');
  }
})();
</script>
