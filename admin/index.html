<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>DEVI GROUPS — Admin</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../cms-config.js"></script>

  <style>
    body {
      font-family: Inter, system-ui, sans-serif;
    }

    .tab.active {
      background: #092c4c;
      color: #fff;
    }
  </style>
</head>

<body class="bg-slate-100 min-h-screen text-slate-900">

  <!-- LOGIN -->
  <div id="login" class="min-h-screen grid place-items-center p-5">

    <form
      id="loginForm"
      class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md"
    >

      <h1 class="text-3xl font-black text-slate-900">
        DEVI GROUPS
      </h1>

      <p class="text-slate-500 mb-6">
        Secure Admin Panel
      </p>

      <!-- Email -->
      <input
        id="email"
        type="email"
        required
        placeholder="Admin email"
        class="w-full border rounded-xl p-3 mb-3"
      >

      <!-- Password -->
      <input
        id="password"
        type="password"
        required
        placeholder="Password"
        class="w-full border rounded-xl p-3 mb-2"
      >

      <!-- Login -->
      <button
        type="submit"
        class="w-full bg-slate-900 text-white rounded-xl p-3 font-bold"
      >
        Sign in
      </button>

      <!-- Forgot Password -->
      <button
        type="button"
        id="forgotBtn"
        class="w-full border rounded-xl p-3 mt-2 font-bold"
      >
        Forgot password?
      </button>

      <!-- RESET EMAIL BOX -->
      <div
        id="forgotBox"
        class="hidden mt-4 border-t pt-4"
      >

        <input
          id="resetEmail"
          type="email"
          placeholder="Admin email"
          class="w-full border rounded-xl p-3 mb-2"
        >

        <button
          type="button"
          id="sendReset"
          class="w-full bg-blue-700 text-white rounded-xl p-3 font-bold"
        >
          Send reset email
        </button>

        <p
          id="resetMsg"
          class="text-sm mt-2"
        ></p>

      </div>

      <!-- NEW PASSWORD BOX -->
      <div
        id="recoveryBox"
        class="hidden mt-4 border-t pt-4"
      >

        <input
          id="newPassword"
          type="password"
          placeholder="New password"
          class="w-full border rounded-xl p-3 mb-2"
        >

        <input
          id="newPassword2"
          type="password"
          placeholder="Confirm new password"
          class="w-full border rounded-xl p-3 mb-2"
        >

        <button
          type="button"
          id="updatePassword"
          class="w-full bg-emerald-700 text-white rounded-xl p-3 font-bold"
        >
          Update password
        </button>

        <p
          id="recoveryMsg"
          class="text-sm mt-2"
        ></p>

      </div>

      <!-- LOGIN ERROR -->
      <p
        id="loginMsg"
        class="text-sm mt-3 text-rose-600"
      ></p>

    </form>
  </div>


  <!-- ADMIN APP -->
  <div id="app" class="hidden min-h-screen">

    <!-- HEADER -->
    <header
      class="bg-slate-950 text-white px-5 py-4 flex justify-between items-center"
    >

      <div>

        <b class="text-xl">
          DEVI GROUPS ADMIN
        </b>

        <span
          id="userEmail"
          class="text-xs text-slate-400 ml-3"
        ></span>

      </div>

      <button
        id="logout"
        class="bg-white/10 px-4 py-2 rounded-lg"
      >
        Logout
      </button>

    </header>


    <!-- CONTENT -->
    <div class="max-w-7xl mx-auto p-5">

      <div class="grid lg:grid-cols-[220px_1fr] gap-5">

        <!-- SIDEBAR -->
        <aside
          class="bg-white rounded-2xl p-3 h-fit space-y-1"
        >

          <button
            class="tab active w-full text-left p-3 rounded-xl"
            data-view="dashboard"
          >
            Dashboard
          </button>

          <button
            class="tab w-full text-left p-3 rounded-xl"
            data-view="products"
          >
            Products
          </button>

          <button
            class="tab w-full text-left p-3 rounded-xl"
            data-view="units"
          >
            Business Units
          </button>

          <button
            class="tab w-full text-left p-3 rounded-xl"
            data-view="homepage"
          >
            Homepage
          </button>

          <button
            class="tab w-full text-left p-3 rounded-xl"
            data-view="enquiries"
          >
            Enquiries
          </button>

          <button
            class="tab w-full text-left p-3 rounded-xl"
            data-view="reviews"
          >
            Reviews
          </button>

          <button
            class="tab w-full text-left p-3 rounded-xl"
            data-view="company"
          >
            Company / Contact
          </button>

          <button
            class="tab w-full text-left p-3 rounded-xl"
            data-view="documents"
          >
            Documents
          </button>

          <button
            class="tab w-full text-left p-3 rounded-xl"
            data-view="tracking"
          >
            Tracking
          </button>

        </aside>


        <!-- MAIN -->
        <main
          id="main"
          class="bg-white rounded-2xl p-5 min-h-[600px]"
        ></main>

      </div>

    </div>

  </div>


  <script src="admin.js"></script>

</body>
</html>
