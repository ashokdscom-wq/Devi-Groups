<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="DEVI GROUPS Admin Panel"
  />

  <title>DEVI GROUPS – Admin Panel</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    body {
      min-height: 100vh;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      color: inherit;
    }

    #app {
      min-height: 100vh;
    }

    /* =========================
       LOGIN FALLBACK
       ========================= */

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(
          circle at top left,
          rgba(37, 99, 235, 0.12),
          transparent 38%
        ),
        radial-gradient(
          circle at bottom right,
          rgba(15, 118, 110, 0.12),
          transparent 38%
        ),
        #f5f7fb;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 32px;
      box-shadow:
        0 20px 50px rgba(15, 23, 42, 0.08),
        0 4px 12px rgba(15, 23, 42, 0.04);
    }

    .login-logo {
      width: 72px;
      height: 72px;
      object-fit: contain;
      margin: 0 auto 18px;
      border-radius: 12px;
    }

    .login-title {
      margin: 0;
      text-align: center;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .login-subtitle {
      margin: 7px 0 26px;
      text-align: center;
      color: #6b7280;
      font-size: 14px;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 700;
      color: #374151;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 11px 13px;
      outline: none;
      background: #fff;
      color: #111827;
      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: #2563eb;
      box-shadow:
        0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .login-button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      background: #111827;
      color: #ffffff;
      font-weight: 700;
      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    .login-button:hover {
      opacity: 0.92;
    }

    .login-button:active {
      transform: translateY(1px);
    }

    .login-button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .login-message {
      min-height: 20px;
      margin: 2px 0 0;
      font-size: 13px;
      text-align: center;
    }

    .login-forgot {
      margin-top: 14px;
      text-align: center;
    }

    .login-forgot button {
      border: 0;
      padding: 0;
      background: transparent;
      color: #2563eb;
      font-size: 13px;
      font-weight: 600;
    }

    .login-forgot button:hover {
      text-decoration: underline;
    }

    /* =========================
       ADMIN SHELL FALLBACK
       ========================= */

    .admin-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #f5f7fb;
    }

    .admin-header {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 12px 22px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .admin-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
    }

    .admin-brand img {
      width: 38px;
      height: 38px;
      object-fit: contain;
      border-radius: 8px;
    }

    .admin-brand-text {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .admin-brand-title {
      font-size: 15px;
      line-height: 1.2;
    }

    .admin-brand-subtitle {
      color: #6b7280;
      font-size: 11px;
      font-weight: 600;
    }

    .admin-user {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .admin-user-email {
      color: #4b5563;
      font-size: 13px;
    }

    .admin-logout {
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #ffffff;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 700;
    }

    .admin-layout {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    .admin-sidebar {
      width: 245px;
      flex: 0 0 245px;
      background: #111827;
      color: #ffffff;
      padding: 18px 12px;
    }

    .admin-nav {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .admin-nav button {
      width: 100%;
      border: 0;
      border-radius: 8px;
      padding: 10px 12px;
      background: transparent;
      color: #d1d5db;
      text-align: left;
      font-size: 13px;
      font-weight: 600;
    }

    .admin-nav button:hover,
    .admin-nav button.active {
      background: #1f2937;
      color: #ffffff;
    }

    .admin-main {
      flex: 1;
      min-width: 0;
      padding: 24px;
      overflow: auto;
    }

    .admin-container {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
    }

    .admin-page-title {
      margin: 0 0 6px;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .admin-page-subtitle {
      margin: 0 0 24px;
      color: #6b7280;
      font-size: 14px;
    }

    .admin-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 20px;
      box-shadow:
        0 4px 12px rgba(15, 23, 42, 0.03);
    }

    .admin-card + .admin-card {
      margin-top: 18px;
    }

    .admin-table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    .admin-table th,
    .admin-table td {
      padding: 11px 12px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
      font-size: 13px;
      vertical-align: middle;
    }

    .admin-table th {
      background: #f9fafb;
      color: #374151;
      font-weight: 800;
    }

    .admin-table td {
      color: #4b5563;
    }

    .admin-primary {
      border: 0;
      border-radius: 8px;
      background: #111827;
      color: #ffffff;
      padding: 9px 13px;
      font-size: 13px;
      font-weight: 700;
    }

    .admin-secondary {
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #ffffff;
      color: #374151;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 700;
    }

    .admin-danger {
      border: 1px solid #fecaca;
      border-radius: 8px;
      background: #fff1f2;
      color: #b91c1c;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 700;
    }

    .admin-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .empty-state {
      padding: 40px 20px;
      text-align: center;
      color: #6b7280;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 800px) {
      .admin-layout {
        flex-direction: column;
      }

      .admin-sidebar {
        width: 100%;
        flex-basis: auto;
        padding: 10px;
      }

      .admin-nav {
        flex-direction: row;
        overflow-x: auto;
      }

      .admin-nav button {
        white-space: nowrap;
        width: auto;
      }

      .admin-main {
        padding: 16px;
      }

      .admin-user-email {
        display: none;
      }

      .admin-header {
        padding: 10px 14px;
      }
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 24px 20px;
        border-radius: 14px;
      }

      .login-title {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

    Main application container.

    IMPORTANT:
    admin.js will render the actual Login screen and Admin Panel
    inside this element.
  -->
  <div id="app">

    <!-- Fallback loading screen -->
    <div
      style="
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:24px;
        color:#6b7280;
        font-size:14px;
      "
    >
      Loading DEVI GROUPS Admin Panel...
    </div>

  </div>

 <script src="cms-config.js?v=20260914"></script>

<!-- Supabase JavaScript SDK -->
<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<!-- Main Admin Panel JavaScript -->
<script src="admin.js?v=20260914"></script>

</body>
</html>
