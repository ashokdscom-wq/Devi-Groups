<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEVI GROUPS - Admin Panel</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../cms-config.js"></script>

  <style>
    body {
      background: #f5f7fb;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div id="loginPage" class="min-h-screen flex items-center justify-center p-6">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-lg p-8">

      <h1 class="text-2xl font-bold text-center mb-2">
        DEVI GROUPS
      </h1>

      <p class="text-center text-gray-500 mb-6">
        Secure Admin Panel
      </p>

      <form id="loginForm">

        <label class="block text-sm font-medium mb-2">
          Email
        </label>

        <input
          id="email"
          type="email"
          required
          class="w-full border rounded-lg px-4 py-3 mb-4"
          placeholder="Admin Email"
        >

        <label class="block text-sm font-medium mb-2">
          Password
        </label>

        <input
          id="password"
          type="password"
          required
          class="w-full border rounded-lg px-4 py-3 mb-3"
          placeholder="Password"
        >

        <button
          type="button"
          id="forgotBtn"
          class="text-sm text-blue-600 hover:underline mb-4"
        >
          Forgot password?
        </button>

        <button
          type="submit"
          class="w-full bg-blue-600 text-white rounded-lg py-3 font-semibold hover:bg-blue-700"
        >
          Sign in
        </button>

      </form>

      <div id="loginMessage" class="text-sm mt-4 text-center"></div>

      <!-- RESET EMAIL -->
      <div id="resetBox" class="hidden mt-6 border-t pt-6">

        <h2 class="font-semibold text-lg mb-3">
          Reset Password
        </h2>

        <p class="text-sm text-gray-500 mb-4">
          Enter your admin email. We will send you a password reset link.
        </p>

        <input
          id="resetEmail"
          type="email"
          class="w-full border rounded-lg px-4 py-3 mb-3"
          placeholder="Admin Email"
        >

        <button
          type="button"
          id="sendResetBtn"
          class="w-full bg-green-600 text-white rounded-lg py-3 font-semibold hover:bg-green-700"
        >
          Send Reset Email
        </button>

        <div id="resetMessage" class="text-sm mt-3 text-center"></div>

      </div>

    </div>
  </div>


  <!-- PASSWORD RECOVERY -->
  <div
    id="recoveryPage"
    class="hidden min-h-screen flex items-center justify-center p-6"
  >

    <div class="bg-white w-full max-w-md rounded-2xl shadow-lg p-8">

      <h1 class="text-2xl font-bold text-center mb-2">
        Set New Password
      </h1>

      <p class="text-center text-gray-500 mb-6">
        Create a new admin password
      </p>

      <input
        id="newPassword"
        type="password"
        class="w-full border rounded-lg px-4 py-3 mb-4"
        placeholder="New Password"
      >

      <input
        id="confirmPassword"
        type="password"
        class="w-full border rounded-lg px-4 py-3 mb-4"
        placeholder="Confirm Password"
      >

      <button
        type="button"
        id="updatePasswordBtn"
        class="w-full bg-blue-600 text-white rounded-lg py-3 font-semibold hover:bg-blue-700"
      >
        Update Password
      </button>

      <div id="recoveryMessage" class="text-sm mt-4 text-center"></div>

    </div>
  </div>


  <!-- ADMIN PANEL -->
  <div id="adminPage" class="hidden min-h-screen">

    <div class="flex min-h-screen">

      <!-- SIDEBAR -->
      <aside class="w-64 bg-gray-900 text-white p-5">

        <h2 class="text-xl font-bold mb-8">
          DEVI GROUPS
        </h2>

        <div class="space-y-2">

          <button data-view="dashboard"
            class="navBtn w-full text-left px-4 py-3 rounded-lg hover:bg-gray-800">
            Dashboard
          </button>

          <button data-view="products"
            class="navBtn w-full text-left px-4 py-3 rounded-lg hover:bg-gray-800">
            Products
          </button>

          <button data-view="business"
            class="navBtn w-full text-left px-4 py-3 rounded-lg hover:bg-gray-800">
            Business Units
          </button>

          <button data-view="homepage"
            class="navBtn w-full text-left px-4 py-3 rounded-lg hover:bg-gray-800">
            Homepage
          </button>

          <button data-view="enquiries"
            class="navBtn w-full text-left px-4 py-3 rounded-lg hover:bg-gray-800">
            Enquiries
          </button>

          <button data-view="reviews"
            class="navBtn w-full text-left px-4 py-3 rounded-lg hover:bg-gray-800">
            Reviews
          </button>

          <button data-view="company"
            class="navBtn w-full text-left px-4 py-3 rounded-lg hover:bg-gray-800">
            Company / Contact
          </button>

          <button data-view="documents"
            class="navBtn w-full text-left px-4 py-3 rounded-lg hover:bg-gray-800">
            Documents
          </button>

          <button data-view="tracking"
            class="navBtn w-full text-left px-4 py-3 rounded-lg hover:bg-gray-800">
            Tracking
          </button>

        </div>

        <button
          id="logoutBtn"
          class="w-full mt-10 bg-red-600 hover:bg-red-700 px-4 py-3 rounded-lg"
        >
          Logout
        </button>

      </aside>


      <!-- MAIN -->
      <main class="flex-1 p-8">

        <div class="flex justify-between items-center mb-8">

          <div>
            <h1 id="pageTitle" class="text-3xl font-bold">
              Dashboard
            </h1>

            <p class="text-gray-500">
              DEVI GROUPS Administration
            </p>
          </div>

        </div>

        <div id="app"></div>

      </main>

    </div>
  </div>


  <script src="./admin.js"></script>

</body>
</html>
