
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>DEVI GROUPS — Admin</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Supabase configuration: admin/cms-config.js -->
  <script src="./cms-config.js?v=20260917"></script>

  <style>
    body {
      font-family: Inter, system-ui, sans-serif;
    }

    .tab.active {
      background: #092c4c;
      color: #fff;
    }
  </style>
</head>

<body class="bg-slate-100 min-h-screen text-slate-900">

  <!-- LOGIN -->
  <div id="login" class="min-h-screen grid place-items-center p-5">

    <form id="loginForm"
      class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md">

      <h1 class="text-3xl font-black text-slate-900">
        DEVI GROUPS
      </h1>

      <p class="text-slate-500 mb-6">
        Secure Admin Panel
      </p>

      <input
        id="email"
        type="email"
        required
        autocomplete="username"
        placeholder="Admin email"
        class="w-full border rounded-xl p-3 mb-3"
      >

      <input
        id="password"
        type="password"
        required
        autocomplete="current-password"
        placeholder="Password"
        class="w-full border rounded-xl p-3 mb-4"
      >

      <button
        type="submit"
        class="w-full bg-slate-900 text-white rounded-xl p-3 font-bold"
      >
        Sign in
      </button>

      <p
        id="loginMsg"
        role="status"
        aria-live="polite"
        class="text-sm mt-3 text-rose-600"
      ></p>

    </form>
  </div>


  <!-- ADMIN APP -->
  <div id="app" class="hidden min-h-screen">

    <header
      class="bg-slate-950 text-white px-5 py-4 flex justify-between items-center"
    >

      <div>
        <b class="text-xl">
          DEVI GROUPS ADMIN
        </b>

        <span
          id="userEmail"
          class="text-xs text-slate-400 ml-3"
        ></span>
      </div>

      <button
        id="logout"
        type="button"
        class="bg-white/10 px-4 py-2 rounded-lg"
      >
        Logout
      </button>

    </header>


    <div class="max-w-7xl mx-auto p-5">

      <div class="grid lg:grid-cols-[220px_1fr] gap-5">

        <!-- SIDEBAR -->
        <aside
          class="bg-white rounded-2xl p-3 h-fit space-y-1"
          aria-label="Admin navigation"
        >

          <button
            type="button"
            class="tab active w-full text-left p-3 rounded-xl"
            data-view="dashboard"
          >
            Dashboard
          </button>

          <button
            type="button"
            class="tab w-full text-left p-3 rounded-xl"
            data-view="products"
          >
            Products
          </button>

          <button
            type="button"
            class="tab w-full text-left p-3 rounded-xl"
            data-view="units"
          >
            Business Units
          </button>

          <button
            type="button"
            class="tab w-full text-left p-3 rounded-xl"
            data-view="homepage"
          >
            Homepage
          </button>

          <button
            type="button"
            class="tab w-full text-left p-3 rounded-xl"
            data-view="enquiries"
          >
            Enquiries
          </button>

          <button
            type="button"
            class="tab w-full text-left p-3 rounded-xl"
            data-view="reviews"
          >
            Reviews
          </button>

          <button
            type="button"
            class="tab w-full text-left p-3 rounded-xl"
            data-view="company"
          >
            Company / Contact
          </button>

          <button
            type="button"
            class="tab w-full text-left p-3 rounded-xl"
            data-view="documents"
          >
            Documents
          </button>

          <button
            type="button"
            class="tab w-full text-left p-3 rounded-xl"
            data-view="tracking"
          >
            Tracking
          </button>

        </aside>


        <!-- MAIN -->
        <main
          id="main"
          class="bg-white rounded-2xl p-5 min-h-[600px]"
          tabindex="-1"
        ></main>

      </div>

    </div>

  </div>


  <!-- ADMIN JAVASCRIPT -->
  <script src="./admin.js?v=20260917"></script>

</body>
</html>
