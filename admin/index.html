<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>DEVI GROUPS — Final Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../cms-config.js"></script>
    <style>html,body{height:100%;margin:0}#siteFrame{width:100%;height:100%;border:0}.glass{backdrop-filter:blur(10px)}</style>
</head>
<body class="bg-slate-100 text-slate-900">

<!-- Login Screen -->
<div id="login" class="min-h-screen grid place-items-center">
    <form id="loginForm" class="bg-white rounded-3xl shadow-2xl p-8 w-[min(420px,92vw)]">
        <h1 class="text-3xl font-black text-slate-900">DEVI GROUPS</h1>
        <p class="text-slate-500 mb-6 text-sm">Secure Visual Admin Panel</p>
        <input id="email" type="email" required placeholder="Admin email" class="w-full border border-slate-300 rounded-xl p-3 mb-3 text-sm focus:outline-none focus:border-emerald-500">
        <input id="password" type="password" required placeholder="Password" class="w-full border border-slate-300 rounded-xl p-3 mb-4 text-sm focus:outline-none focus:border-emerald-500">
        <button class="w-full bg-slate-900 hover:bg-slate-800 text-white rounded-xl p-3 font-bold transition">Login to Admin</button>
        <div id="loginMsg" class="text-xs text-rose-600 mt-3 font-bold"></div>
    </form>
</div>

<!-- Main Admin App -->
<div id="app" class="hidden h-screen flex flex-col">
    <header class="h-16 bg-slate-950 text-white flex items-center justify-between px-5 shrink-0 shadow-md">
        <div>
            <b class="text-xl tracking-wide">DEVI GROUPS</b>
            <span class="text-xs text-slate-400 ml-2 hidden sm:inline">Ultimate CMS & Visual Editor</span>
        </div>
        <div class="flex gap-2">
            <button id="refreshSite" class="px-3 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-bold transition flex items-center gap-1.5"><i class="fa-solid fa-rotate"><span>Refresh</span></i></button>
            <a href="../index.html" target="_blank" class="px-3 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-bold transition flex items-center gap-1.5"><i class="fa-solid fa-globe"></i> Website ↗</a>
            <button id="logout" class="px-3 py-2 rounded-xl bg-rose-600/80 hover:bg-rose-600 text-xs font-bold transition flex items-center gap-1.5"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
        </div>
    </header>

    <div class="flex-1 min-h-0 flex">
        <!-- Sidebar with Direct Buttons -->
        <aside class="w-72 bg-white border-r border-slate-200 p-4 overflow-y-auto space-y-3 shrink-0">
            <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Website Pages</div>
            <div id="pages" class="space-y-1"></div>
            
            <hr class="border-slate-200 my-4">
            
            <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Database Managers</div>
            <button id="reviewsBtn" class="w-full text-left p-3 rounded-xl hover:bg-slate-100 font-semibold text-xs flex items-center gap-2 text-slate-700 transition"><i class="fa-solid fa-star text-amber-500 w-4"></i> Manage Reviews</button>
            
            <button id="productsBtn" class="w-full text-left p-3 rounded-xl hover:bg-slate-100 font-semibold text-xs flex items-center gap-2 text-slate-700 transition"><i class="fa-solid fa-box text-blue-500 w-4"></i> View All Products</button>
            <button onclick="newProduct()" class="w-full bg-blue-600 hover:bg-blue-700 text-white p-2.5 rounded-xl font-black text-xs shadow transition flex items-center justify-center gap-1.5"><i class="fa-solid fa-plus"></i> + Add New Product</button>
            
            <button id="unitsBtn" class="w-full text-left p-3 rounded-xl hover:bg-slate-100 font-semibold text-xs flex items-center gap-2 text-slate-700 transition"><i class="fa-solid fa-building text-emerald-500 w-4"></i> Business Units</button>
            
            <button id="brochuresBtn" class="w-full text-left p-3 rounded-xl hover:bg-slate-100 font-semibold text-xs flex items-center gap-2 text-slate-700 transition"><i class="fa-solid fa-file-pdf text-rose-500 w-4"></i> View Brochures</button>
            <button onclick="openBrochureUploadModal()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white p-2.5 rounded-xl font-black text-xs shadow transition flex items-center justify-center gap-1.5"><i class="fa-solid fa-upload"></i> + Upload New Brochure</button>
        </aside>

        <!-- Main Live Frame & Inline Element Editor -->
        <main class="flex-1 min-w-0 relative bg-slate-200">
            <iframe id="siteFrame" src="../index.html?admin=1"></iframe>
            
            <div id="editor" class="hidden absolute top-0 right-0 w-[420px] max-w-[92%] h-full bg-white shadow-2xl overflow-y-auto border-l border-slate-200 z-50">
                <div class="p-5 border-b bg-slate-50 flex justify-between items-center sticky top-0 z-10">
                    <div>
                        <h2 class="text-xl font-black text-slate-800">Edit Element</h2>
                        <p id="selectedInfo" class="text-xs text-slate-500 font-mono mt-0.5"></p>
                    </div>
                    <button id="closeEditor" class="text-xl text-slate-400 hover:text-rose-600"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="p-5 space-y-4 text-xs">
                    <div id="textBox">
                        <label class="font-bold text-slate-700 block mb-1">Display Text</label>
                        <textarea id="textValue" rows="6" class="w-full border border-slate-300 rounded-xl p-3 text-xs focus:outline-none focus:border-emerald-500 shadow-sm"></textarea>
                    </div>
                    <div id="srcBox">
                        <label class="font-bold text-slate-700 block mb-1">Upload Photo / File</label>
                        <input id="fileValue" type="file" class="w-full border border-slate-300 rounded-xl p-2 mb-2 bg-slate-50">
                        <input id="srcValue" class="w-full border border-slate-300 rounded-xl p-2.5 focus:outline-none focus:border-emerald-500" placeholder="Existing URL / path">
                    </div>
                    <div id="hrefBox">
                        <label class="font-bold text-slate-700 block mb-1">Link / Button URL</label>
                        <input id="hrefValue" class="w-full border border-slate-300 rounded-xl p-2.5 focus:outline-none focus:border-emerald-500">
                    </div>
                    <div id="altBox">
                        <label class="font-bold text-slate-700 block mb-1">Alt / Title Text</label>
                        <input id="altValue" class="w-full border border-slate-300 rounded-xl p-2.5 focus:outline-none focus:border-emerald-500">
                    </div>
                    <div id="actionBox" class="hidden space-y-2 bg-slate-50 p-3 rounded-xl border border-slate-200">
                        <label class="font-bold text-slate-800"><i class="fa-solid fa-wrench text-amber-500"></i> Advanced Details</label>
                        <input id="action1" class="w-full border rounded-xl p-2" placeholder="Title / Product Name">
                        <input id="action2" class="w-full border rounded-xl p-2" placeholder="Specification / PDF Link">
                        <input id="action3" class="w-full border rounded-xl p-2" placeholder="Standard / Extra">
                        <input id="action4" class="w-full border rounded-xl p-2" placeholder="Packing">
                    </div>
                    <button id="saveElement" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white p-3 rounded-xl font-black text-sm shadow-md transition">SAVE CHANGES</button>
                    <div id="saveMsg" class="font-bold text-center"></div>
                    <div id="syncMsg" class="text-slate-400 text-center">Changes sync live to website.</div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Drawer for Databases (Products, Units, Brochures, Reviews) -->
<div id="drawer" class="hidden fixed inset-0 bg-black/50 z-[100] glass flex items-center justify-end">
    <div class="h-full w-[600px] max-w-[95vw] bg-white shadow-2xl overflow-y-auto flex flex-col">
        <div class="p-5 border-b bg-slate-50 flex justify-between items-center sticky top-0 z-10">
            <h2 id="drawerTitle" class="text-lg font-black text-slate-800 tracking-wide uppercase"></h2>
            <button id="drawerClose" class="text-xl text-slate-400 hover:text-rose-600"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="drawerBody" class="p-6 flex-grow"></div>
    </div>
</div>

<script>
const cfg = window.DEVI_CMS_CONFIG;
const sb = supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
const frame = document.getElementById('siteFrame');
let selected = null;

const pages = [['home','HOME'],['about','ABOUT US'],['company','COMPANY'],['products','PRODUCTS'],['sister-brand','OUR SISTER BRAND'],['contact','CONTACT US']];

function nav(p) { frame.contentWindow.postMessage({source:'devi-visual-cms', type:'NAVIGATE', page:p}, '*'); }

pages.forEach(([id, n]) => {
    const b = document.createElement('button');
    b.className = 'w-full text-left p-2.5 px-3 rounded-xl hover:bg-slate-100 font-semibold text-slate-700 text-xs transition flex items-center gap-2';
    b.innerHTML = `<i class="fa-solid fa-angle-right text-slate-300"></i> ${n}`;
    b.onclick = () => nav(id);
    document.getElementById('pages').appendChild(b);
});

async function upload(file, folder='visual') {
    if(!file) return '';
    const ext = file.name.includes('.') ? file.name.split('.').pop().toLowerCase() : '';
    const path = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2)}${ext?'.'+ext:''}`;
    const {error} = await sb.storage.from('devi-media').upload(path, file, {upsert:false});
    if(error) throw error;
    return `${cfg.supabaseUrl}/storage/v1/object/public/devi-media/${path}`;
}

window.addEventListener('message', e => {
    if(e.data?.source !== 'devi-visual-cms') return;
    if(e.data.type === 'SELECT') { selected = e.data.element; openEditor(selected); }
    if(e.data.type === 'BROCHURES') { openBrochureManager(e.data.items||[]); }
});

function openEditor(x) {
    document.getElementById('editor').classList.remove('hidden');
    document.getElementById('selectedInfo').innerHTML = `<span class="bg-blue-100 text-blue-800 px-1.5 py-0.5 rounded font-bold">${x.page}</span> • ${x.tag}`;
    document.getElementById('textValue').value = x.text || '';
    document.getElementById('srcValue').value = x.src || '';
    document.getElementById('hrefValue').value = x.href || '';
    document.getElementById('altValue').value = (x.alt||'') + ' ' + (x.title||'');
    
    document.getElementById('textBox').style.display = ['img','video','source','input','textarea'].includes(x.tag) ? 'none' : 'block';
    document.getElementById('srcBox').style.display = ['img','video','source'].includes(x.tag) ? 'block' : 'none';
    document.getElementById('hrefBox').style.display = x.tag === 'a' || x.tag === 'button' ? 'block' : 'none';
    
    const ab = document.getElementById('actionBox');
    ab.classList.add('hidden');
    if(x.onclick) {
        let m = x.onclick.match(/openTechSpecs\('([^']*)',\s*'([^']*)',\s*'([^']*)',\s*'([^']*)'\)/);
        if(m) { ab.classList.remove('hidden'); ['action1','action2','action3','action4'].forEach((id,i) => document.getElementById(id).value = m[i+1]); }
    }
}

document.getElementById('closeEditor').onclick = () => document.getElementById('editor').classList.add('hidden');

document.getElementById('saveElement').onclick = async () => {
    const btn = document.getElementById('saveElement');
    btn.innerText = "SAVING...";
    try {
        const r = {...selected};
        if(document.getElementById('textBox').style.display !== 'none') r.text = document.getElementById('textValue').value;
        r.href = document.getElementById('hrefValue').value;
        r.src = document.getElementById('srcValue').value;
        r.alt = document.getElementById('altValue').value.trim();
        
        const f = document.getElementById('fileValue').files[0];
        if(f) r.src = await upload(f, 'visual');
        
        const key = String(r.id || '').trim();
        if(!key) throw new Error('Missing element ID.');

        const content = JSON.stringify(r);
        const sectionMap = { home:'home', about:'about', company:'company', products:'products', 'sister-brand':'sister-brand', contact:'contact' };
        const section_key = sectionMap[String(r.page || 'home').toLowerCase().trim()] || 'home';

        const { data: old } = await sb.from('site_content').select('id').eq('key', key).maybeSingle();
        let res = old?.id ? await sb.from('site_content').update({ section_key, content, active: true }).eq('id', old.id) : await sb.from('site_content').insert({ section_key, key, content, active: true, title: String(r.page || 'home') });
        if(res.error) throw res.error;

        document.getElementById('saveMsg').innerHTML = '<span class="text-emerald-600">Saved successfully ✓</span>';
        setTimeout(() => { frame.src = '../index.html?admin=1&sync=' + Date.now(); btn.innerText = "SAVE CHANGES"; }, 400);
    } catch(err) {
        document.getElementById('saveMsg').innerHTML = `<span class="text-rose-600">${err.message}</span>`;
        btn.innerText = "SAVE CHANGES";
    }
};

function esc(v) { return String(v??'').replace(/[&<>\"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[m])); }

// ==================== BROCHURES ====================
document.getElementById('brochuresBtn').onclick = () => frame.contentWindow.postMessage({source:'devi-visual-cms', type:'LIST_BROCHURES'}, '*');

window.openBrochureUploadModal = () => {
    document.getElementById('drawerTitle').innerHTML = '<i class="fa-solid fa-file-pdf text-rose-500"></i> Upload Brochure';
    document.getElementById('drawerBody').innerHTML = `
        <div class="space-y-4">
            <label class="block font-bold text-slate-700 text-xs">Select PDF / Document File</label>
            <input type="file" id="uploadBrochureFile" accept=".pdf,.doc,.docx" class="w-full border p-3 rounded-xl bg-slate-50 text-xs">
            <button onclick="submitNewBrochure()" class="w-full bg-emerald-600 text-white p-3 rounded-xl font-black text-xs shadow">Upload & Generate Link</button>
            <div id="brochureUploadStatus" class="hidden p-3 rounded-xl text-xs font-bold"></div>
        </div>`;
    document.getElementById('drawer').classList.remove('hidden');
};

window.submitNewBrochure = async () => {
    const file = document.getElementById('uploadBrochureFile').files[0];
    const status = document.getElementById('brochureUploadStatus');
    if(!file) return alert('Please choose a file first.');
    status.classList.remove('hidden'); status.className = 'p-3 rounded-xl bg-amber-50 text-amber-600 text-xs font-bold'; status.innerText = 'Uploading to cloud...';
    try {
        const url = await upload(file, 'brochures');
        status.className = 'p-4 rounded-xl bg-emerald-50 text-emerald-700 text-xs';
        status.innerHTML = `<b>Uploaded Successfully!</b><br><a href="${url}" target="_blank" class="underline text-blue-600 break-all">${url}</a>`;
    } catch(e) {
        status.className = 'p-3 rounded-xl bg-rose-50 text-rose-600 text-xs font-bold';
        status.innerText = 'Error: ' + e.message;
    }
};

function openBrochureManager(items) {
    document.getElementById('drawerTitle').innerHTML = '<i class="fa-solid fa-file-pdf text-rose-500"></i> Brochure Manager';
    document.getElementById('drawerBody').innerHTML = (items||[]).map((x,i) => `
        <div class="border rounded-2xl p-4 mb-3 bg-slate-50 flex justify-between items-center">
            <div>
                <div class="font-black text-slate-800 text-sm">${i+1}. ${esc(x.title||'Brochure')}</div>
                <div class="text-xs text-slate-500 mt-0.5">${esc(x.file||'')}</div>
            </div>
            <button class="bg-slate-900 text-white px-3 py-1.5 rounded-lg text-xs font-bold" data-bid="${i}">Edit</button>
        </div>`).join('') || '<p class="text-slate-500 text-center py-10">No brochures found.</p>';
    document.querySelectorAll('[data-bid]').forEach(b => b.onclick = () => {
        const x = items[Number(b.dataset.bid)];
        if(x) { selected = x; document.getElementById('drawer').classList.add('hidden'); openEditor(x); }
    });
    document.getElementById('drawer').classList.remove('hidden');
}

// ==================== PRODUCTS ====================
document.getElementById('productsBtn').onclick = async () => {
    const {data, error} = await sb.from('products').select('*').order('name');
    if(error) return alert(error.message);
    document.getElementById('drawerTitle').innerHTML = '<i class="fa-solid fa-box text-blue-500"></i> Products Manager';
    const rows = (data||[]).map((r,i) => `
        <div class="border rounded-2xl p-4 mb-3 bg-white shadow-sm flex justify-between items-center cursor-pointer hover:border-blue-400 transition" onclick='editProduct(${JSON.stringify(r)})'>
            <div>
                <div class="font-black text-slate-800 text-sm">${i+1}. ${esc(r.name||'Product')}</div>
                <div class="text-xs text-slate-500">Click to edit details</div>
            </div>
            <button onclick="event.stopPropagation(); deleteProduct('${r.id}')" class="bg-rose-100 text-rose-600 px-3 py-1.5 rounded-lg text-xs font-bold">Delete</button>
        </div>`).join('');
    document.getElementById('drawerBody').innerHTML = `
        <button onclick="newProduct()" class="w-full bg-blue-600 text-white p-3.5 rounded-xl font-black text-xs mb-4 shadow">+ Add New Product</button>
        ${rows || '<p class="text-slate-500 text-center py-10">No products found.</p>'}`;
    document.getElementById('drawer').classList.remove('hidden');
};

window.newProduct = () => editProduct({ name:'', description:'', category:'', standard_packaging:'', purity:'', image_url:'' }, true);

window.editProduct = (r, isNew=false) => {
    document.getElementById('drawerTitle').innerHTML = isNew ? 'Add New Product' : 'Edit Product';
    let html = Object.keys(r).filter(k => !['id','created_at','updated_at'].includes(k)).map(k => `
        <label class="block mb-3">
            <span class="text-[10px] font-black uppercase text-slate-400">${esc(k)}</span>
            <textarea id="pf_${esc(k)}" data-key="${esc(k)}" class="w-full border rounded-xl p-2.5 mt-1 text-xs focus:outline-none focus:border-emerald-500">${esc(r[k]??'')}</textarea>
        </label>`).join('');
    html += `
        <div class="flex gap-2 mt-5">
            <button onclick="saveProduct('${r.id||''}')" class="flex-1 bg-emerald-600 text-white p-3 rounded-xl font-black text-xs shadow">Save Product</button>
            <button onclick="document.getElementById('productsBtn').click()" class="px-4 bg-slate-200 rounded-xl font-bold text-xs">Cancel</button>
        </div>`;
    document.getElementById('drawerBody').innerHTML = html;
    document.getElementById('drawer').classList.remove('hidden');
};

window.saveProduct = async id => {
    const fields = {};
    document.querySelectorAll('[id^="pf_"]').forEach(x => fields[x.dataset.key] = x.value);
    const q = (id && id !== 'undefined' && id !== '') ? sb.from('products').update(fields).eq('id', id) : sb.from('products').insert([fields]);
    const {error} = await q;
    if(error) alert(error.message); else { alert('Product saved ✓'); document.getElementById('productsBtn').click(); }
};

window.deleteProduct = async id => {
    if(!confirm('Delete this product?')) return;
    const {error} = await sb.from('products').delete().eq('id', id);
    if(error) alert(error.message); else document.getElementById('productsBtn').click();
};

// ==================== REVIEWS ====================
document.getElementById('reviewsBtn').onclick = async () => {
    const {data, error} = await sb.from('reviews').select('*').order('created_at', {ascending: false});
    if(error) return alert(error.message);
    document.getElementById('drawerTitle').innerHTML = '<i class="fa-solid fa-star text-amber-500"></i> Reviews Manager';
    document.getElementById('drawerBody').innerHTML = (data||[]).map((r,i) => `
        <div class="border rounded-2xl p-4 mb-4 bg-slate-50 text-xs">
            <div class="font-black mb-2 text-sm">#${i+1}. Review</div>
            <label class="font-bold">Name<input id="rname${r.id}" value="${esc(r.name||'')}" class="w-full border rounded-lg p-2 mt-1 mb-2 bg-white"></label>
            <label class="font-bold">Country<input id="rcountry${r.id}" value="${esc(r.country||'')}" class="w-full border rounded-lg p-2 mt-1 mb-2 bg-white"></label>
            <label class="font-bold">Stars<input id="rstars${r.id}" type="number" min="1" max="5" value="${r.stars||5}" class="w-full border rounded-lg p-2 mt-1 mb-2 bg-white"></label>
            <label class="font-bold">Message<textarea id="rv${r.id}" rows="3" class="w-full border rounded-lg p-2 mt-1 mb-3 bg-white">${esc(r.message||r.review||'')}</textarea></label>
            <div class="flex gap-2">
                <button onclick="saveReview('${r.id}')" class="bg-emerald-600 text-white font-bold px-4 py-2 rounded-lg">Save</button>
                <button onclick="deleteReview('${r.id}')" class="bg-rose-100 text-rose-600 font-bold px-4 py-2 rounded-lg">Delete</button>
            </div>
        </div>`).join('') || '<p class="text-slate-500 text-center py-10">No reviews found.</p>';
    document.getElementById('drawer').classList.remove('hidden');
};

window.saveReview = async id => {
    const msg = document.getElementById('rv'+id).value, name = document.getElementById('rname'+id).value, country = document.getElementById('rcountry'+id).value, stars = Number(document.getElementById('rstars'+id).value)||5;
    const {error} = await sb.from('reviews').update({name, country, stars, message:msg, review:msg}).eq('id', id);
    if(error) alert(error.message); else alert('Review saved ✓');
};
window.deleteReview = async id => {
    if(!confirm('Delete review?')) return;
    const {error} = await sb.from('reviews').delete().eq('id', id);
    if(error) alert(error.message); else document.getElementById('reviewsBtn').click();
};

// ==================== BUSINESS UNITS ====================
document.getElementById('unitsBtn').onclick = async () => {
    const {data, error} = await sb.from('business_units').select('*').order('id',{ascending:true});
    if(error) return alert(error.message);
    document.getElementById('drawerTitle').innerHTML = '<i class="fa-solid fa-building text-emerald-500"></i> Business Units';
    document.getElementById('drawerBody').innerHTML = (data||[]).map((r,i) => `
        <div class="border rounded-2xl p-4 mb-3 bg-white flex justify-between items-center">
            <div><div class="font-black text-sm text-slate-800">${esc(r.name||r.title||'Unit')}</div></div>
            <button onclick='editUnit(${JSON.stringify(r)})' class="bg-slate-900 text-white px-3 py-1.5 rounded-lg text-xs font-bold">Edit</button>
        </div>`).join('') || '<p class="text-slate-500 text-center py-10">No units found.</p>';
    document.getElementById('drawer').classList.remove('hidden');
};

window.editUnit = r => {
    document.getElementById('drawerTitle').innerHTML = 'Edit Business Unit';
    document.getElementById('drawerBody').innerHTML = `
        <div class="space-y-3 text-xs">
            <label class="font-bold">Name<input id="u_name" class="w-full border p-2.5 rounded-xl mt-1" value="${esc(r.name||r.title||'')}"></label>
            <label class="font-bold">Description<textarea id="u_desc" rows="5" class="w-full border p-2.5 rounded-xl mt-1">${esc(r.description||'')}</textarea></label>
            <label class="font-bold">Image URL<input id="u_img" class="w-full border p-2.5 rounded-xl mt-1" value="${esc(r.image_url||'')}"></label>
            <button onclick="saveUnit('${r.id}')" class="w-full bg-emerald-600 text-white p-3 rounded-xl font-black mt-2 shadow">Save Unit</button>
        </div>`;
};

window.saveUnit = async id => {
    const payload = { name: document.getElementById('u_name').value.trim(), description: document.getElementById('u_desc').value.trim(), image_url: document.getElementById('u_img').value.trim() };
    const {error} = await sb.from('business_units').update(payload).eq('id', id);
    if(error) alert(error.message); else { alert('Unit saved ✓'); document.getElementById('unitsBtn').click(); }
};

document.getElementById('refreshSite').onclick = () => frame.src = '../index.html?admin=1&sync=' + Date.now();
document.getElementById('drawerClose').onclick = () => document.getElementById('drawer').classList.add('hidden');

document.getElementById('loginForm').onsubmit = async e => {
    e.preventDefault();
    const {error} = await sb.auth.signInWithPassword({ email: email.value.trim(), password: password.value });
    if(error) { document.getElementById('loginMsg').textContent = error.message; return; }
    document.getElementById('login').classList.add('hidden'); document.getElementById('app').classList.remove('hidden');
};

document.getElementById('logout').onclick = async () => { await sb.auth.signOut(); location.reload(); };

sb.auth.getSession().then(({data}) => {
    if(data.session) { document.getElementById('login').classList.add('hidden'); document.getElementById('app').classList.remove('hidden'); }
});
</script>
</body>
</html>
