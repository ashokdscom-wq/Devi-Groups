<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DEVI GROUPS — Complete Visual Admin</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../cms-config.js"></script><style>html,body{height:100%;margin:0}#siteFrame{width:100%;height:100%;border:0}.glass{backdrop-filter:blur(10px)}</style></head><body class="bg-slate-100 text-slate-900">
<div id="login" class="min-h-screen grid place-items-center"><form id="loginForm" class="bg-white rounded-3xl shadow-2xl p-8 w-[min(420px,92vw)]"><h1 class="text-3xl font-black">DEVI GROUPS</h1><p class="text-slate-500 mb-6">Complete Website Visual Admin Panel</p><input id="email" type="email" required placeholder="Admin email" class="w-full border rounded-xl p-3 mb-3"><input id="password" type="password" required placeholder="Password" class="w-full border rounded-xl p-3 mb-4"><button class="w-full bg-slate-900 text-white rounded-xl p-3 font-bold">Login</button><div id="loginMsg" class="text-sm text-rose-600 mt-3"></div></form></div>
<div id="app" class="hidden h-screen flex flex-col"><header class="h-16 bg-slate-950 text-white flex items-center justify-between px-5 shrink-0"><div><b class="text-xl">DEVI GROUPS</b><span class="text-xs text-slate-400 ml-2">Exact Website Visual Editor</span></div><div class="flex gap-2"><button id="refreshSite" class="px-3 py-2 rounded-lg bg-white/10">↻ Refresh Website</button><a href="../index.html" target="_blank" class="px-3 py-2 rounded-lg bg-white/10">Open Website ↗</a><button id="logout" class="px-3 py-2 rounded-lg bg-white/10">Logout</button></div></header>
<div class="flex-1 min-h-0 flex"><aside class="w-64 bg-white border-r p-3 overflow-y-auto"><div class="font-black mb-2">WEBSITE PAGES</div><div id="pages" class="space-y-1"></div><hr class="my-4"><button id="reviewsBtn" class="w-full text-left p-3 rounded-xl hover:bg-slate-100 font-semibold">★ Reviews</button><button id="productsBtn" class="w-full text-left p-3 rounded-xl hover:bg-slate-100 font-semibold">▦ Products</button><button id="unitsBtn" class="w-full text-left p-3 rounded-xl hover:bg-slate-100 font-semibold">▤ Business Units</button><button id="brochuresBtn" class="w-full text-left p-3 rounded-xl hover:bg-slate-100 font-semibold">▣ Brochures</button></aside><main class="flex-1 min-w-0 relative bg-slate-200"><iframe id="siteFrame" src="../index.html?admin=1"></iframe><div id="editor" class="hidden absolute top-0 right-0 w-[420px] max-w-[92%] h-full bg-white shadow-2xl overflow-y-auto"><div class="p-5 border-b flex justify-between"><div><h2 class="text-2xl font-black">Edit</h2><p id="selectedInfo" class="text-xs text-slate-500"></p></div><button id="closeEditor" class="text-2xl">×</button></div><div class="p-5 space-y-4"><div id="textBox"><label class="font-bold text-sm">Text</label><textarea id="textValue" rows="7" class="w-full border rounded-xl p-3 mt-1"></textarea></div><div id="srcBox"><label class="font-bold text-sm">Photo / Video / File</label><input id="fileValue" type="file" class="w-full border rounded-xl p-2 mt-1"><input id="srcValue" class="w-full border rounded-xl p-3 mt-2" placeholder="Existing URL / path"></div><div id="hrefBox"><label class="font-bold text-sm">Link / Button URL</label><input id="hrefValue" class="w-full border rounded-xl p-3 mt-1"></div><div id="altBox"><label class="font-bold text-sm">Alt / Title</label><input id="altValue" class="w-full border rounded-xl p-3 mt-1"></div><div id="actionBox" class="hidden space-y-2"><label class="font-bold text-sm">TDS / Brochure / Image Details</label><input id="action1" class="w-full border rounded-xl p-3" placeholder="Title / Product"><input id="action2" class="w-full border rounded-xl p-3" placeholder="Specification / File"><input id="action3" class="w-full border rounded-xl p-3" placeholder="Standard / Extra"><input id="action4" class="w-full border rounded-xl p-3" placeholder="Packing (if applicable)"><div id="brochureTools" class="hidden border rounded-xl p-3 bg-slate-50 space-y-2"><div class="text-xs font-bold">Brochure File</div><input id="brochureFile" type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx" class="w-full border rounded-lg p-2 bg-white"><div class="text-xs text-slate-500">Upload a new brochure to replace the current one.</div><label class="flex items-center gap-2 text-sm font-semibold"><input id="deleteBrochure" type="checkbox"> Delete / hide brochure from website</label></div></div><button id="saveElement" class="w-full bg-emerald-600 text-white p-3 rounded-xl font-black">SAVE CHANGES</button><div id="saveMsg" class="text-sm"></div><div id="syncMsg" class="text-xs text-slate-500">Changes are saved to the live CMS.</div></div></div></main></div></div>
<div id="drawer" class="hidden fixed inset-0 bg-black/40 z-50"><div class="absolute right-0 top-0 h-full w-[560px] max-w-[96vw] bg-white overflow-y-auto"><div class="p-5 border-b flex justify-between"><h2 id="drawerTitle" class="text-2xl font-black"></h2><button id="drawerClose" class="text-2xl">×</button></div><div id="drawerBody" class="p-5"></div></div></div>
<script>
const cfg=window.DEVI_CMS_CONFIG; const sb=supabase.createClient(cfg.supabaseUrl,cfg.supabaseKey); const frame=document.getElementById('siteFrame'); let selected=null;
const pages=[['home','HOME'],['about','ABOUT US'],['company','COMPANY'],['products','PRODUCTS'],['sister-brand','OUR SISTER BRAND'],['contact','CONTACT US']];
function nav(p){frame.contentWindow.postMessage({source:'devi-visual-cms',type:'NAVIGATE',page:p},'*')}
pages.forEach(([id,n])=>{const b=document.createElement('button');b.className='w-full text-left p-3 rounded-xl hover:bg-slate-100 font-semibold';b.textContent=n;b.onclick=()=>nav(id);document.getElementById('pages').appendChild(b)});
async function upload(file,folder='visual'){if(!file)return '';const ext=file.name.includes('.')?file.name.split('.').pop().toLowerCase():'';const path=`${folder}/${Date.now()}-${Math.random().toString(36).slice(2)}${ext?'.'+ext:''}`;const {error}=await sb.storage.from('devi-media').upload(path,file,{upsert:false});if(error)throw error;return `${cfg.supabaseUrl}/storage/v1/object/public/devi-media/${path}`}
window.addEventListener('message',e=>{if(e.data?.source!=='devi-visual-cms')return;if(e.data.type==='SELECT'){selected=e.data.element;openEditor(selected)} if(e.data.type==='BROCHURES'){openBrochureManager(e.data.items||[]);}});
function openEditor(x){
 document.getElementById('editor').classList.remove('hidden');
 document.getElementById('selectedInfo').textContent=x.page+' • '+x.tag+' • '+x.id;
 document.getElementById('textValue').value=x.text||x.value||'';
 document.getElementById('srcValue').value=x.src||'';
 document.getElementById('hrefValue').value=x.href||'';
 document.getElementById('altValue').value=(x.alt||'')+' '+(x.title||'');
 document.getElementById('textBox').style.display=['img','video','source','input','textarea'].includes(x.tag)?'none':'block';
 document.getElementById('srcBox').style.display=['img','video','source'].includes(x.tag)?'block':'none';
 document.getElementById('hrefBox').style.display=x.tag==='a'||x.tag==='button'?'block':'none';
 const ab=document.getElementById('actionBox'); const bt=document.getElementById('brochureTools');
 ab.classList.add('hidden'); bt.classList.add('hidden');
 document.getElementById('deleteBrochure').checked=false; document.getElementById('brochureFile').value='';
 if(x.onclick){
  let m=x.onclick.match(/openTechSpecs\('([^']*)',\s*'([^']*)',\s*'([^']*)',\s*'([^']*)'\)/);
  if(m){ab.classList.remove('hidden');['action1','action2','action3','action4'].forEach((id,i)=>document.getElementById(id).value=m[i+1]);ab.dataset.type='tds';}
  else{
   m=x.onclick.match(/openBrochureViewer\('([^']*)',\s*'([^']*)'\)/);
   if(m){ab.classList.remove('hidden');bt.classList.remove('hidden');document.getElementById('action1').value=m[1];document.getElementById('action2').value=m[2];document.getElementById('action3').value='';document.getElementById('action4').value='';ab.dataset.type='brochure';}
   else{m=x.onclick.match(/openLightbox\('([^']*)'\)/);if(m){ab.classList.remove('hidden');document.getElementById('action1').value=m[1];ab.dataset.type='image';}}
  }
 }
}
document.getElementById('closeEditor').onclick=()=>document.getElementById('editor').classList.add('hidden');
document.getElementById('saveElement').onclick=async()=>{try{
 const r={...selected};
 if(document.getElementById('textBox').style.display!=='none') r.text=document.getElementById('textValue').value;
 r.href=document.getElementById('hrefValue').value;
 r.src=document.getElementById('srcValue').value;
 const at=document.getElementById('altValue').value.trim(); r.alt=at;
 const ab=document.getElementById('actionBox');
 const q=v=>String(v??'').replaceAll('\\','\\\\').replaceAll("'","\\'");
 if(!ab.classList.contains('hidden')){
   const a1 = document.getElementById('action1').value;
let a2 = document.getElementById('action2').value;
const a3 = document.getElementById('action3').value;
const a4 = document.getElementById('action4').value;
   if(ab.dataset.type==='tds') r.onclick=`openTechSpecs('${q(a1)}','${q(a2)}','${q(a3)}','${q(a4)}')`;
   if(ab.dataset.type==='brochure'){
     const bf=document.getElementById('brochureFile').files[0];
     if(bf) a2=await upload(bf,'brochures');
     if(document.getElementById('deleteBrochure').checked){ r.onclick=''; r.hidden=true; }
     else { r.onclick=`openBrochureViewer('${q(a1)}','${q(a2)}')`; r.hidden=false; }
   }
   if(ab.dataset.type==='image') r.onclick=`openLightbox('${q(a1)}')`;
 }
 const f=document.getElementById('fileValue').files[0];
 if(f) r.src=await upload(f,'visual');
 const key = String(r.id || '').trim();
if (!key) throw new Error('Selected element is missing its key/id.');

const content = JSON.stringify(r);

const sectionMap = {
  home: 'home',
  about: 'about',
  company: 'company',
  products: 'products',
  'sister-brand': 'sister-brand',
  contact: 'contact'
};

const section_key = sectionMap[String(r.page || '').toLowerCase()];
if (!section_key) {
  throw new Error('Unknown page section: ' + String(r.page || '(empty)'));
}

const { data: old, error: lookupError } = await sb
  .from('site_content')
  .select('id')
  .eq('key', key)
  .maybeSingle();

if (lookupError) throw lookupError;

let result;

if (old?.id) {
  result = await sb
    .from('site_content')
    .update({ section_key, content, active: true })
    .eq('id', old.id);
} else {
  result = await sb
    .from('site_content')
    .insert({
      section_key,
      key,
      content,
      active: true,
      title: String(r.page || '')
    });
}

if (result.error) throw result.error;
 frame.contentWindow.postMessage({source:'devi-visual-cms',type:'APPLY',element:r},'*');
 document.getElementById('saveMsg').textContent='Saved to live website ✓';
 document.getElementById('saveMsg').className='text-sm text-emerald-600';
 document.getElementById('syncMsg').textContent='Live sync complete. Refreshing website…';
 setTimeout(()=>{frame.src='../index.html?admin=1&sync='+Date.now();},150);
}catch(err){document.getElementById('saveMsg').textContent=err.message;document.getElementById('saveMsg').className='text-sm text-rose-600';}};
function openBrochureManager(items){
 document.getElementById('drawerTitle').textContent='BROCHURES';
 document.getElementById('drawerBody').innerHTML=(items||[]).map((x,i)=>`<div class="border rounded-2xl p-4 mb-3"><div class="font-black">${i+1}. ${esc(x.title||x.name||'Brochure')}</div><div class="text-xs text-slate-500 mb-3">${esc(x.page||'')} • ${esc(x.file||'')}</div><button class="bg-slate-900 text-white px-4 py-2 rounded-lg" data-bid="${i}">Open / Edit Brochure</button></div>`).join('')||'<p class="text-slate-500">No brochure buttons found on this page.</p>';
 document.querySelectorAll('[data-bid]').forEach(b=>b.onclick=()=>{const x=items[Number(b.dataset.bid)];if(x){selected=x;document.getElementById('drawer').classList.add('hidden');openEditor(x);}});
 document.getElementById('drawer').classList.remove('hidden');
}
document.getElementById('brochuresBtn').onclick=()=>frame.contentWindow.postMessage({source:'devi-visual-cms',type:'LIST_BROCHURES'},'*');

async function openReviews(){const {data,error}=await sb.from('reviews').select('*').order('created_at',{ascending:false});if(error)return alert(error.message);document.getElementById('drawerTitle').textContent='REVIEWS';document.getElementById('drawerBody').innerHTML=(data||[]).map((r,i)=>`<div class="border rounded-2xl p-4 mb-3"><div class="font-black mb-2">${i+1}. Review</div><label class="text-xs font-bold">Name<input id="rname${r.id}" value="${esc(r.name||'')}" class="w-full border rounded-xl p-2 mt-1"></label><label class="text-xs font-bold block mt-2">Country<input id="rcountry${r.id}" value="${esc(r.country||'')}" class="w-full border rounded-xl p-2 mt-1"></label><label class="text-xs font-bold block mt-2">Stars<input id="rstars${r.id}" type="number" min="1" max="5" value="${r.stars||r.rating||5}" class="w-full border rounded-xl p-2 mt-1"></label><label class="text-xs font-bold block mt-2">Review Text<textarea id="rv${r.id}" rows="4" class="w-full border rounded-xl p-3 mt-1">${esc(r.message||r.msg||r.review||'')}</textarea></label><div class="flex gap-2 mt-3"><button onclick="saveReview('${r.id}')" class="bg-emerald-600 text-white px-4 py-2 rounded-lg">Save</button><button onclick="deleteReview('${r.id}')" class="bg-rose-600 text-white px-4 py-2 rounded-lg">Delete</button></div></div>`).join('')||'<p class="text-slate-500">No database reviews yet.</p>';document.getElementById('drawer').classList.remove('hidden')}
function esc(v){return String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[m]))}
window.saveReview=async id=>{const msg=document.getElementById('rv'+id).value;const name=document.getElementById('rname'+id).value;const country=document.getElementById('rcountry'+id).value;const stars=Number(document.getElementById('rstars'+id).value)||5;const {error}=await sb.from('reviews').update({name,country,stars,message:msg,review:msg}).eq('id',id);if(error)alert(error.message);else alert('Review saved ✓')};window.deleteReview=async id=>{if(!confirm('Delete this review?'))return;const {error}=await sb.from('reviews').delete().eq('id',id);if(error)alert(error.message);else openReviews()};
async function openProducts(){const {data,error}=await sb.from('products').select('*').order('name');if(error)return alert(error.message);document.getElementById('drawerTitle').textContent='PRODUCTS';document.getElementById('drawerBody').innerHTML=(data||[]).map((r,i)=>`<div class="border rounded-2xl p-4 mb-3 cursor-pointer hover:bg-slate-50" onclick='editProduct(${JSON.stringify(r)})'><div class="font-black">${i+1}. ${esc(r.name||'')}</div><div class="text-xs text-slate-500">Click to open all product fields</div></div>`).join('');document.getElementById('drawer').classList.remove('hidden')}
window.editProduct=r=>{document.getElementById('drawerTitle').textContent='EDIT PRODUCT';document.getElementById('drawerBody').innerHTML=Object.keys(r).filter(k=>!['id','created_at','updated_at'].includes(k)).map(k=>`<label class="block mb-3"><span class="text-xs font-bold">${esc(k)}</span><textarea id="pf_${esc(k)}" data-key="${esc(k)}" class="w-full border rounded-xl p-2 mt-1">${esc(r[k]??'')}</textarea></label>`).join('')+`<button onclick="saveProduct('${r.id}')" class="w-full bg-emerald-600 text-white p-3 rounded-xl font-black">SAVE PRODUCT</button>`};
window.saveProduct=async id=>{const fields={};document.querySelectorAll('[id^="pf_"]').forEach(x=>fields[x.dataset.key]=x.value);const {error}=await sb.from('products').update(fields).eq('id',id);if(error)alert(error.message);else{alert('Product saved ✓');openProducts()}};
async function openUnits(){
  const {data,error}=await sb.from('business_units').select('*').order('id',{ascending:true});
  if(error)return alert(error.message);
  document.getElementById('drawerTitle').textContent='BUSINESS UNITS';
  const rows=(data||[]).map((r,i)=>`<div class="border rounded-2xl p-4 mb-3">
    <div class="flex gap-4 items-start">
      <div class="w-24 h-20 rounded-xl bg-slate-100 overflow-hidden shrink-0">${r.image_url?`<img src="${esc(r.image_url)}" class="w-full h-full object-cover">`:'<div class="h-full grid place-items-center text-xs text-slate-400">No Image</div>'}</div>
      <div class="flex-1 min-w-0"><div class="font-black text-lg">${esc(r.name||r.title||'Business Unit')}</div><div class="text-sm text-slate-500 mt-1 whitespace-pre-wrap">${esc(r.description||'')}</div>${r.website?`<div class="text-xs text-blue-600 mt-2 break-all">${esc(r.website)}</div>`:''}</div>
    </div>
    <div class="flex gap-2 mt-4"><button class="bg-slate-900 text-white px-4 py-2 rounded-lg" onclick='editUnit(${JSON.stringify(r)})'>Edit</button><button class="bg-rose-600 text-white px-4 py-2 rounded-lg" onclick="deleteUnit('${r.id}')">Delete</button></div>
  </div>`).join('');
  document.getElementById('drawerBody').innerHTML=`<button onclick="newUnit()" class="w-full bg-emerald-600 text-white p-3 rounded-xl font-black mb-4">+ ADD BUSINESS UNIT</button>${rows||'<p class="text-slate-500">No Business Units found.</p>'}`;
  document.getElementById('drawer').classList.remove('hidden');
}
function unitForm(r={}){
  document.getElementById('drawerTitle').textContent=r.id?'EDIT BUSINESS UNIT':'ADD BUSINESS UNIT';
  document.getElementById('drawerBody').innerHTML=`<div class="space-y-4">
    <label class="block"><span class="text-xs font-bold">Name</span><input id="u_name" class="w-full border rounded-xl p-3 mt-1" value="${esc(r.name||r.title||'')}"></label>
    <label class="block"><span class="text-xs font-bold">Description</span><textarea id="u_desc" rows="6" class="w-full border rounded-xl p-3 mt-1">${esc(r.description||'')}</textarea></label>
    <label class="block"><span class="text-xs font-bold">Website URL</span><input id="u_web" class="w-full border rounded-xl p-3 mt-1" value="${esc(r.website||r.website_url||'')}"></label>
    <label class="block"><span class="text-xs font-bold">Image URL</span><input id="u_img" class="w-full border rounded-xl p-3 mt-1" value="${esc(r.image_url||'')}"></label>
    <label class="block"><span class="text-xs font-bold">New Image</span><input id="u_file" type="file" accept="image/*" class="w-full border rounded-xl p-3 mt-1"></label>
    ${r.image_url?`<img src="${esc(r.image_url)}" class="w-48 h-32 object-cover rounded-xl border">`:''}
    <div class="flex gap-2"><button onclick="saveUnit(${r.id?`'${r.id}'`:'null'})" class="flex-1 bg-emerald-600 text-white p-3 rounded-xl font-black">SAVE</button><button onclick="openUnits()" class="px-5 bg-slate-200 rounded-xl font-bold">Cancel</button></div>
  </div>`;
}
window.newUnit=()=>unitForm({});
window.editUnit=r=>unitForm(r);
window.saveUnit=async id=>{try{
  const name=document.getElementById('u_name').value.trim(); if(!name)return alert('Name is required.');
  let image=document.getElementById('u_img').value.trim(); const f=document.getElementById('u_file').files[0]; if(f) image=await upload(f,'business-units');
  const payload={name,description:document.getElementById('u_desc').value.trim(),website:document.getElementById('u_web').value.trim(),image_url:image};
  const q=id?sb.from('business_units').update(payload).eq('id',id):sb.from('business_units').insert(payload); const {error}=await q; if(error)throw error; await openUnits();
}catch(e){alert(e.message||'Unable to save business unit.')}};
window.deleteUnit=async id=>{if(!confirm('Delete this Business Unit?'))return;const {error}=await sb.from('business_units').delete().eq('id',id);if(error)alert(error.message);else openUnits()};
document.getElementById('refreshSite').onclick=()=>{frame.src='../index.html?admin=1&sync='+Date.now();document.getElementById('editor').classList.add('hidden');};
document.getElementById('reviewsBtn').onclick=openReviews;document.getElementById('productsBtn').onclick=openProducts;document.getElementById('unitsBtn').onclick=openUnits;document.getElementById('drawerClose').onclick=()=>document.getElementById('drawer').classList.add('hidden');
document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('loginMsg');msg.textContent='Logging in...';const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){msg.textContent=error.message;return}document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden')};document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
sb.auth.getSession().then(({data})=>{if(data.session){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden')}});
</script></body></html>
